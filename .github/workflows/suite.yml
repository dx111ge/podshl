# Both suites, on every push.
#
# Nothing gated a commit in this repository until today. `TESTCASES.md` has said
# for months that the client is untested through its window; what it did not say
# is that the parts which *are* tested were only tested when somebody remembered
# to run them. On 2026-09-15 two fixes went in half done — a library that grew an
# option its only caller could not pass, and a release task that copied every
# version it found into one release — and both were caught by hand, the second
# minutes before publishing. Neither would have survived this.
#
# It runs `scripts/ci.sh`, which is the same command a developer runs before
# pushing. There is deliberately no CI-only shell here: a gate that exists only
# on a server is one nobody runs first, and a gate that exists only on a laptop
# is one CI cannot enforce.
#
# **Where this runs.** On the public mirror, which is fed by hand after a change
# is already pushed — so this one reports rather than gates. The gate is
# `.gitea/workflows/suite.yml`, on the working repository, which has a runner
# (`local-builder`) that was there all along; the first version of this comment
# said it did not, which was wrong and was worth checking rather than assuming.
#
# Both are worth having. This one runs on a clean machine and the Gitea one does
# not, and the difference between them is exactly the class of failure that
# passes locally and fails for everybody else.
name: suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first: the answer everybody waits for is the one
# about the tip.
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    # The image installs a Rust toolchain and the Tauri CLI on a cold runner,
    # then builds the client and runs 338 cases. Generous, but bounded: a job
    # that hangs until the default six hours is a job nobody reads.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # `CL1`–`CL4` walk the real binary against the live operator, and the
      # index cases verify its signed directory with the key compiled in. They
      # need the network, and they are meant to: a fixture would prove the two
      # halves agree with a file rather than with each other.
      - name: Both suites
        run: scripts/ci.sh sdota.de

      # The artefacts of a failure, because a red run whose output has scrolled
      # away is a red run nobody can act on.
      - name: What the client log said
        if: failure()
        run: |
          docker compose run --rm --no-deps --entrypoint sh podshl \
            -c 'cat "${XDG_STATE_HOME:-$HOME/.local/state}/podshl/client.log" 2>/dev/null || echo "(no client log)"'
