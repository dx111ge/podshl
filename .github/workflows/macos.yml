# The macOS client, on GitHub's own macOS runners.
#
# Tauri does not cross-compile, and a hosted runner is a machine running the
# target system, which is the only real requirement (RELEASING.md). arm64 only:
# an Intel build nobody has run would be coverage in name only.
#
# Runs when a release is published, and attaches the app to it; or by hand, and
# keeps the result as a workflow artifact. Built for the operator named below,
# with that operator's public log key from release/<host>/log_key.json.
name: macOS client

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  OPERATOR: sdota.de

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: client-rs
        run: |
          set -euo pipefail
          export PODSHL_BUILD_SERVER_URL="https://${OPERATOR}"
          export PODSHL_BUILD_INDEX_URL="https://${OPERATOR}"
          export PODSHL_BUILD_LOG_KEY="$(cat "../release/${OPERATOR}/log_key.json")"
          npx --yes @tauri-apps/cli@2 build --bundles app,dmg

      - name: Package
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' client-rs/Cargo.toml | cut -d'"' -f2)
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          bundle=client-rs/target/release/bundle
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          cp "$dmg" "$out/podshl-client-${version}-macos-arm64.dmg"
          ditto -c -k --keepParent "$bundle/macos/PODSHL.app" "$out/podshl-client-${version}-macos-arm64.app.zip"
          (cd "$out" && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos)
          cat "$out/SHA256SUMS-macos"
          file client-rs/target/release/podshl-client
          echo "OUT=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: podshl-client-macos-arm64
          path: ${{ env.OUT }}/*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$OUT"/* --clobber
