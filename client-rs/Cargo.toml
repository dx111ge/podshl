[package]
name = "podshl-client"
version = "0.1.9"
edition = "2021"
# Three programs: the client; the helper that does what needs administrator
# rights (`src/bin/podshl-elevate.rs`); and `podshl-repairs`, the record of
# local fixes on its own (`src/bin/podshl-repairs.rs`). `cargo run` means the
# client.
default-run = "podshl-client"
# The toolchain this is built and tested with, and the only one: the image,
# the macOS workflows and `rust-toolchain.toml` all name 1.94.0. It said 1.77,
# which nothing ever built, and clippy held the code to it.
rust-version = "1.94"
description = "Basic Agent — verifies a vendor, collects locally, asks, then acts"

# **A surface that a released client does not have.**
#
# The window's flow can only be driven headlessly if `invoke` can reach the
# commands it calls, and three of those run readings on somebody's machine,
# send their data, or spend their money. Putting them on the surface for
# everybody would remove the consent screens from a program people install; an
# environment variable guarding them would be one variable away from the same
# thing.
#
# So they exist only when this feature is on. `scripts/build/build_client.sh` and
# `build_client.ps1` build without it, which is what every release is, so a
# released binary cannot be asked. Turning it on is a decision made at compile
# time by whoever builds — not at run time by whatever is running.
[features]
uitest = []

# What the client and `podshl-repairs` share, and the protocol does not reach:
# see `src/lib.rs`. Named for the record rather than for the package, because
# that is what it is for.
[lib]
name = "podshl_repairs"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Signature verification is the trust boundary; strict verification only.
ed25519-dalek = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time"] }
anyhow = "1"
regex = "1"
dirs = "5"
# ANS publishes agent keys as DNS TXT records, so the production trust path
# needs a real resolver rather than a stub that is never constructed.
hickory-resolver = "0.24"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
# API keys belong in the OS credential store, not in a config file. keyring
# covers Secret Service, Windows Credential Manager and macOS Keychain.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Only to restore the default SIGPIPE disposition on the command-line path. The
# Rust runtime sets SIGPIPE to SIG_IGN, which turns `demo | head` into a panic
# and — with panic = "abort" below — a core dump.
# The Service Control Manager and the machine's registry: read by the client,
# written only by `podshl-elevate`. And the one call that asks Windows to start
# that helper as administrator.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The suite talks to the real counterparty over HTTP, so the tests need an async
# runtime. Test-only: the application drives its own futures from the window and
# never starts one of these.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
# A trust client should be small and quick to audit.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
