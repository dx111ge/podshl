async function refreshLlmChip(){
  const chip=$("llmchip");
  chip.className="chip"; chip.textContent="…";
  const st=await invoke("llm_probe");
  if(st.state==="unconfigured"){
    chip.className="chip missing"; chip.textContent=t("llm_none"); chip.title=t("llm_tip_none");
  } else if(st.state==="reachable"){
    chip.className="chip ok"; chip.textContent=st.label; chip.title=t("llm_tip_ok",{m:st.label,n:st.models});
  } else {
    chip.className="chip missing"; chip.textContent=t("llm_offline",{m:st.label});
    chip.title=t("llm_tip_off",{e:tr(st.error)});
  }
  return st;
}

async function openSettings(){
  const [c, provs] = await Promise.all([llmGet(), invoke("llm_providers")]);
  const el=add(`<h3>${t("set_h")}</h3><p>${t("set_1")}</p>
    <div class="ask">
      <label class="sr" for="lprov">${t("set_provider")}</label>
      <select id="lprov">${provs.map(p=>`<option value="${esc(p.id)}"${c.provider===p.id?" selected":""}>${esc(tr(p.name))}</option>`).join("")}</select>
      <label class="sr" for="lclass">${t("set_class")}</label>
      <select id="lclass">
        <option value="local_small"${c.model_class==="local_small"?" selected":""}>${t("cls_small")}</option>
        <option value="local_large"${c.model_class==="local_large"?" selected":""}>${t("cls_large")}</option>
        <option value="cloud"${c.model_class==="cloud"?" selected":""}>${t("cls_cloud")}</option>
      </select>
    </div>
    <div class="ask"><label class="sr" for="lep">${t("set_ep")}</label>
      <input id="lep" placeholder="${t("set_ep")}" value="${esc(c.endpoint||"")}"></div>
    <div class="ask" id="keyrow"><label class="sr" for="lkey">${t("set_key_ph")}</label>
      <input id="lkey" type="password" autocomplete="off"
      placeholder="${c.has_key?t("set_key_have"):t("set_key_ph")}">
      <button class="ghost" id="lkeyrm"${c.has_key?"":" hidden"}>${t("set_key_remove")}</button></div>
    <p class="why" id="keynote">${t("set_key_note")}</p>
    <div class="ask">
      <label class="sr" for="lmodel">${t("set_model")}</label>
      <input id="lmodel" placeholder="${t("set_model")}" value="${esc(c.model||"")}" list="modellist">
      <datalist id="modellist"></datalist>
      <button class="ghost" id="lload">${t("set_load")}</button>
    </div>
    <div id="lstatus" class="why"></div>
    <div class="btns"><button class="primary" id="lsave">${t("set_save")}</button>
      <button class="ghost" id="ltest" title="${esc(t("set_test_cost"))}">${t("set_test")}</button>
      <button class="ghost" id="lclose">${t("close")}</button></div>`, "panel", "llmpanel");

  const $$=id=>el.querySelector("#"+id);
  // A class the person picked stays picked. The preset used to reset it on
  // every change of provider, so choosing "large, local" and then correcting
  // the provider quietly put it back to "small".
  let classChosen=false;
  $$("lclass").onchange=()=>{ classChosen=true; };
  const showKey=needs=>{ $$("keyrow").hidden=!needs; $$("keynote").hidden=!needs; };
  const applyPreset=()=>{
    const p=provs.find(x=>x.id===$$("lprov").value); if(!p) return;
    if(!$$("lep").value || provs.some(x=>x.base===$$("lep").value)) $$("lep").value=p.base;
    if(p.hint && !$$("lmodel").value) $$("lmodel").value=p.hint;
    showKey(p.needs_key);
    if(!classChosen) $$("lclass").value=p.local?"local_small":"cloud";
  };
  $$("lprov").onchange=applyPreset;
  if(!c.provider) applyPreset();
  else showKey((provs.find(x=>x.id===c.provider)||{needs_key:true}).needs_key);

  const collect=()=>({provider:$$("lprov").value, model:$$("lmodel").value.trim(),
    endpoint:$$("lep").value.trim(), modelClass:$$("lclass").value,
    apiKey:$$("lkey").value===""?null:$$("lkey").value});

  // Looking is not saving. Both buttons below used to write the form to disk
  // first, so pressing "Load models" to see what a provider offers replaced
  // the settings a person had. The list is asked for with the form's values;
  // the test runs against what is saved and says so, since the command tests
  // the stored configuration and nothing else.
  $$("lload").onclick=async()=>{
    $$("lstatus").textContent=t("set_loading");
    try{
      const r=await invoke("llm_models",{provider:$$("lprov").value, endpoint:$$("lep").value.trim()});
      el.querySelector("#modellist").innerHTML=r.models.map(m=>`<option value="${esc(m)}">`).join("");
      $$("lstatus").textContent=n("set_loaded", r.models.length);
      if(!$$("lmodel").value && r.models.length) $$("lmodel").value=r.models[0];
    }catch(e){ $$("lstatus").textContent=t("set_load_fail",{e:tr(e)}); }
  };
  $$("ltest").onclick=async()=>{
    $$("lstatus").textContent=t("set_testing");
    try{
      const r=await invoke("llm_test");
      $$("lstatus").innerHTML=`${t("set_test_ok",{m:esc(r.label), ms:esc(r.ms), a:esc(r.answer)})} <span class="c-muted">${t("set_test_saved")}</span>`;
    }catch(e){ $$("lstatus").innerHTML=t("set_test_fail",{e:esc(tr(e))}); }
    await refreshLlmChip();
  };
  // The stored key goes on a button, not on a magic value typed into the key
  // field — "enter an em-dash to delete" is a convention nobody would guess
  // and a screen reader would not distinguish from a hyphen.
  $$("lkeyrm").onclick=async()=>{
    try{
      await llmSet({...collect(), apiKey:""});
      $$("lkey").value=""; $$("lkey").placeholder=t("set_key_ph"); $$("lkeyrm").hidden=true;
      $$("lstatus").textContent=t("set_key_removed");
      await refreshLlmChip();
    }catch(e){ $$("lstatus").textContent=tr(e); }
  };
  $$("lsave").onclick=async()=>{
    try{
      const r=await llmSet(collect());
      $$("lkey").value="";
      if(r.has_key){ $$("lkey").placeholder=t("set_key_have"); $$("lkeyrm").hidden=false; }
      const st=await refreshLlmChip();
      syncHint(st);
      el.className=r.configured?"panel":"panel stop";
      $$("lstatus").innerHTML=r.configured
        ? (st.state==="reachable"?t("set_saved_ok"):t("set_saved_unreach"))
        : t("set_incomplete");
    }catch(e){ el.className="panel stop"; $$("lstatus").textContent=tr(e); }
  };
  $$("lclose").onclick=()=>el.remove();
}

function applyLang(){
  document.documentElement.lang = LANG;
  $("go").textContent=t("go");
  $("problem").placeholder=t("ph_problem");
  $("problem").setAttribute("aria-label", t("ph_problem"));
  $("vquery").placeholder=t("ph_vendor");
  $("vquery").setAttribute("aria-label", t("ph_vendor"));
  $("lang").setAttribute("aria-label", t("lang_label"));
  if(!$("who").textContent || $("dot").className==="dot") $("who").textContent=t("novendor_chip");
  $("proofsum").textContent=t("proof");
  // The introduction is rebuilt in the new language; a run's panels are not.
  // Switching the language used to wipe the screen, diagnosis and all, and
  // the results of a run are not something a person expects a menu to erase.
  if(main.children.length && !$("intro")) return null;
  main.innerHTML="";
  const intro=add(`<h3>${t("intro_h")}</h3><p>${t("intro_1")}</p>
    <p class="note c-muted">${t("intro_2")}</p>
    <p class="note c-warn" id="llmhint" hidden>${t("intro_nollm")}</p>
    <details class="more"><summary>${t("vocab_h")}</summary>
      <div id="vocablist" class="why"></div>
      <p class="why">${t("vocab_1")}</p>
      <div class="btns"><button class="ghost" id="resetid">${t("reset_id")}</button></div>
    </details>
    <p class="note c-muted">${t("yours_1")}
      <code id="publishurl">${esc(SERVER_URL)}/publish</code>
      <button class="ghost" id="copypublish">${t("yours_copy")}</button></p>`, "panel", "intro");
  // **The address of the operator this client was built for**, not a constant.
  // A client built for somebody else's operator that pointed people at ours
  // would be sending them to register with a service they are not using.
  //
  // Shown and copyable rather than opened: this client cannot open a browser,
  // which is the same reason `escalate.target` is shown rather than clicked. A
  // copy button is what it can honestly offer, and the clipboard is already
  // here for the issue report.
  const cp = $("copypublish");
  if(cp) cp.onclick = async () => {
    const url = `${SERVER_URL}/publish`;
    try{ await navigator.clipboard.writeText(url); }
    catch(_){ const r=document.createRange(); r.selectNode($("publishurl"));
              getSelection().removeAllRanges(); getSelection().addRange(r); }
    cp.textContent = t("yours_copied");
  };
  // The vocabulary is the product's central claim; showing it is not a detail.
  invoke("vocabulary").then(v=>{
    const box=$("vocablist");
    if(!box) return;
    const li = (head, sub) => `<li><span><span class="lbl">${esc(head)}</span>
      ${sub?`<br><span class="why">${esc(sub)}</span>`:""}</span></li>`;
    box.innerHTML =
      `<ul class="plain">${v.actions.map(a=>li(actText(a), a.id)).join("")}</ul>
       <div class="lbl mt4">${t("vocab_read")}</div>
       <ul class="plain">${v.readable.map(r=>li(tr(r.describes), r.id)).join("")}</ul>
       ${v.unavailable.length?`<div class="lbl mt4">${t("vocab_unavail")}</div>
         <ul class="plain">${v.unavailable.map(u=>li(tr(u.describes), tr(u.why))).join("")}</ul>`:""}`;
  });
  // A right nobody can exercise is not a right.
  $("resetid").onclick=async()=>{
    await invoke("identity_reset");
    $("vocablist").insertAdjacentHTML("afterend",
      `<p class="why c-ok">${t("reset_done")}</p>`);
  };
  return intro;
}

$("lang").onchange=async()=>{
  const pick=$("lang").value;
  // Fetched now rather than at startup. A language nobody chooses is never
  // downloaded, which is the whole point of the index beside these files.
  try{ await loadTable(pick); }
  catch(e){ logUi(`language ${pick} failed to load: ${e && e.message || e}`); $("lang").value=LANG; return; }
  LANG=pick;
  try{ localStorage.setItem("lang", LANG); }catch(_){}
  // **When the introduction is rebuilt, the repair panels go with it.**
  // `applyLang` protects a run's panels and empties `#main` otherwise, and
  // before a run the repair panel stands beside the introduction — so picking
  // a language threw away the one panel that greets somebody with a fix that
  // wants another look, and left them on a screen that says nothing is wrong.
  // Found by walking the panel in German; the first walk of it read English
  // only and never touched the picker. Rebuilt rather than kept, because the
  // point of the picker is to say it again in the chosen language.
  if(applyLang()) showRepairs();
  syncHint(await refreshLlmChip());
};

/* Changes this client made that want another look (`repair.rs`).

   Asked once when the window opens, because "after every update" is, from
   here, "the next time anybody looks". Nothing is undone from this panel
   except by the person pressing Undo; keeping a change records that they
   looked, at the version installed now, and an update raises it again. */
async function showRepairs(){
  let items;
  try{ items = await invoke("repairs_review"); }catch(e){ logUi(`repairs not reviewed: ${e}`); return; }
  // Called again when the language changes, so anything this drew before goes
  // first: a second copy of the same panel would read as a second finding.
  for(const old of document.querySelectorAll("#main .panel.repair")) old.remove();
  if(!items || !items.length) return;
  const flagText = f => ({
    updated: t("repair_updated", {from: esc(f.from), to: esc(f.to)}),
    upstream_says_fixed: t("repair_fixed", {fixed: esc(f.fixed_in), now: esc(f.installed)}),
    cannot_compare: esc(tr(f.why)),
    overwritten: t("repair_overwritten"),
    no_longer_set: t("repair_no_longer_set"),
    file_changed: t("repair_file_changed"),
    frozen: t("repair_frozen", {now: esc(f.installed), avail: esc(f.available)}),
    original_changed: t("repair_original_changed"),
    issue_closed: t("repair_issue_closed"),
    pr_merged: t("repair_pr_merged"),
    released_in: t("repair_released_in", {tag: esc(f.tag)}),
    target_gone: t("repair_target_gone"),
    backup_gone: t("repair_backup_gone"),
  })[f.kind] || esc(f.kind);
  items.forEach(({record: r, flags}) => {
    const when = new Date(r.at * 1000).toLocaleDateString(LANG);
    const what = r.kind && r.kind !== "action"
      ? `${({file: t("repair_kind_file"), package: t("repair_kind_package"), overlay: t("repair_kind_overlay")})[r.kind] || r.kind}${r.target ? ": " + r.target_shown : ""}`
      : `${r.action} ${Object.entries(r.params).map(([k,v])=>`${k}=${v}`).join(" ")}`;
    const facts = {[t("repair_what")]: what,
                   [t("repair_when")]: when,
                   [t(r.kind && r.kind !== "action" ? "repair_by" : "repair_who")]: r.subject || "—"};
    if(r.upstream && r.upstream.package) facts[t("repair_package")] =
      r.upstream.package + (r.installed ? ` ${r.installed.version}` : "");
    // As text to copy, not a link: the window opens nothing outside itself.
    if(r.upstream && r.upstream.issue) facts[t("repair_issue")] = r.upstream.issue;
    // An undo needs the file and its copy; offering it without them offers an error.
    const gone = flags.some(f => f.kind === "backup_gone" || f.kind === "target_gone");
    const external = r.kind === "file" && !!r.backup && r.reversible && !gone;
    const canUndo = !!r.undo || external || (r.reversible && r.params.file && !gone);
    // Only a GitHub link can be looked up, and only the person turns it on.
    const watchable = /^https:\/\/github\.com\/[^/]+\/[^/]+\/(issues|pull)\/\d+/.test((r.upstream||{}).issue || "");
    const el = add(`<h3>${t("repairs_h")}</h3><p>${t(r.kind && r.kind !== "action" ? "repairs_ext_1" : "repairs_1")}</p>
      <ul class="plain">${flags.map(f=>`<li><span>${flagText(f)}</span></li>`).join("")}</ul>
      ${kvText(facts)}
      ${watchable ? `<p class="note c-muted">${t(r.watch_issue ? "repair_watching_note" : "repair_watch_note")}</p>` : ""}
      <div class="btns">${canUndo ? `<button class="ghost undo">${t("undo")}</button>` : ""}
        ${watchable ? `<button class="ghost watch">${t(r.watch_issue ? "repair_unwatch" : "repair_watch")}</button>` : ""}
        <button class="keep">${t("repair_keep")}</button></div>`, "panel repair");
    const watch = el.querySelector(".watch");
    if(watch) watch.onclick = async () => {
      try{
        await invoke("repair_watch", {id: r.id, on: !r.watch_issue});
        r.watch_issue = !r.watch_issue;
        watch.textContent = t(r.watch_issue ? "repair_unwatch" : "repair_watch");
        const note = el.querySelector("p.note.c-muted");
        if(note) note.textContent = t(r.watch_issue ? "repair_watching_note" : "repair_watch_note");
      }catch(e){ el.innerHTML += `<p class="c-stop">${esc(tr(e))}</p>`; }
    };
    const undo = el.querySelector(".undo");
    if(undo) undo.onclick = async () => {
      try{
        if(external && !r.undo){
          await invoke("repair_restore", {id: r.id});
        } else {
          const call = r.undo || {action:"restore_backup", params:{file:r.params.file}};
          await invoke("execute", {action:call.action, params:call.params,
                                   subject:r.subject, upstream:null, note:null, undoes:r.id});
        }
        // Still a repair panel: it keeps the mark, so a later language change
        // takes it away with the rest rather than leaving one stale panel in
        // the old language behind.
        el.className = "panel repair"; el.innerHTML = `<h3>${t("undone_h")}</h3><p>${t("undone_1")}</p>`;
      }catch(e){ el.innerHTML += `<p class="c-stop">${esc(tr(e))}</p>`; }
    };
    el.querySelector(".keep").onclick = async () => {
      try{ await invoke("repair_looked_at", {id: r.id}); el.remove(); }
      catch(e){ el.innerHTML += `<p class="c-stop">${esc(tr(e))}</p>`; }
    };
  });
}

/* A window that fails to start must say so.

   `loadLanguages` throws when a language file cannot be fetched, and an
   exception here abandons the rest of boot — so every label stays empty and the
   user gets a blank window that looks like a hung application rather than a
   broken one. Nothing in the product is allowed to fail silently; this least of
   all, because it is the failure a user meets first and can report least. */
function bootFailed(e){
  const box = document.getElementById("main");
  if(box) box.innerHTML =
    `<div class="panel stop" role="alert"><h3>PODSHL could not start</h3>`
    + `<p>This window could not load its own files.</p>`
    + `<p class="why"><code>${String(e && e.message || e).replace(/[<&]/g, "")}</code></p>`
    + `<p class="why">Nothing was read from this device and nothing was sent.</p></div>`;
  console.error("[podshl] boot failed:", e);
}

window.addEventListener("load", async () => {
 try {
  // Before anything reaches the network. `endpoints` is a local call into the
  // binary, so a wrong or unreachable server is a later failure with a message,
  // not a silent fall back to loopback in the middle of a report.
  const ep = await invoke("endpoints");
  SERVER_URL = ep.operator; INDEX_URL = ep.index;
  // Which language before the tables, so only two are fetched rather than all.
  let saved=null; try{ saved=localStorage.getItem("lang"); }catch(_){}
  const locale = saved ? null : await invoke("os_locale");
  const wanted = saved || (locale && locale.code) || "en";
  await loadLanguages(wanted);
  LANG = LANGUAGES[wanted] ? wanted : "en";
  $("lang").innerHTML=Object.entries(LANGUAGES).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  $("lang").value=LANG;
  applyLang();
  // **A language we do not have is said, not silently swapped.** Somebody whose
  // system asks for Polish used to get an English window and no word about why
  // — which reads as a product that ignored them rather than one that has not
  // been translated yet. In English on purpose: it is the one sentence shown
  // only to a person we have no language for, so it is read from the English
  // table whatever the picker ends up on, and translating it is harmless and
  // pointless.
  if(locale && locale.code && locale.code !== "en" && !LANGUAGES[locale.code]){
    add(`<p class="why">${esc(I18N.en.no_language.split("{c}").join(locale.code))}</p>`, "panel");
  }
  // Said on screen, not only in the log. `cargo test` rebuilds this binary
  // without `PODSHL_BUILD_*` and what comes out points at loopback with no
  // pinned key — a client that starts, draws this window, and cannot verify a
  // published directory, so every project falls through to the model. It has
  // cost this project days. A development build now looks like one.
  //
  // **After the language files, not before.** `t()` reads `I18N.en`, which is
  // empty until `loadLanguages()` returns — calling it here first threw, and a
  // throw in `boot` is the "PODSHL could not start" screen. A marker about a
  // build being untrustworthy must never be the reason the window will not
  // open, so it is also wrapped.
  try{
    if(ep.built === false || ep.has_key === false){
      const chip = $("devbuild");
      chip.textContent = t("devbuild");
      chip.title = t("devbuild_why", {o: ep.operator});
      chip.hidden = false;
    }
  }catch(_){}
  setTimeout(()=>$("problem").focus(), 60);
  syncHint(await refreshLlmChip());

  // The published catalogue, on a clock of its own.
  //
  // Not once at startup: the catalogue moves — projects are published,
  // deprecated, held — and this window stays open for days. Not on the search
  // path either, and that is the important half: a fetch arriving the moment a
  // user types would tell the operator that *a* search happened, which is the
  // one thing the whole download-it-whole design is protecting. So the timing
  // is independent of the person using it. `refresh_index` is conditional —
  // it re-fetches only past MAX_AGE_MS, and an unchanged catalogue costs a 304.
  //
  // Failing is a legitimate state, not an error worth a dialog: without it a
  // project may not be found by name, which is a far smaller thing than a
  // wrong answer. The old cache stands and its age is reported.
  const syncIndex = () => invoke("refresh_index",{base:SERVER_URL})
    .then(r=>console.log(`[podshl] index ${r.fetched?"fetched":"still current"}: `
      + `${r.entries} entries at tree size ${r.tree_size}`))
    .catch(async e=>{
      const have=await invoke("index_status");
      console.warn(`[podshl] index not refreshed (${e}); `
        + (have.have ? `using the cached one, ${have.entries} entries, `
                     + `${Math.round(have.age_ms/3600000)} h old` : "none cached"));
    });
  syncIndex();
  setInterval(syncIndex, 6*60*60*1000);
  showRepairs();
 } catch(e) { bootFailed(e); }
});
</script>
</body>
</html>
