/* ------------------------------------ a published answer, before any model */

/* Reached when the index found somebody who publishes for this. `pick.answers`
   are the problem classes they declared — the vocabulary they can answer in —
   so the user picks one rather than us guessing which of their words maps to
   which of the publisher's.

   Returns true when it answered — or when the person ended it — so the
   caller knows not to reach for a model. */
/* What happened on the published path, rather than whether it "worked".
   It returned a bare `false` for six different things, and `noVendorPath`
   treated all of them as permission to hand the person to a model — so an
   operator that did not answer was indistinguishable from a person saying
   "none of these". On 2026-09-15 that was the whole of the defect reported the
   day before: a stale DNS record made `/mirror` unreachable, and the window
   said the project published nothing and started a model on its own.

   "answered" means the path is finished and nothing more is owed, including
   when the person refused to send — their refusal was the answer. */
async function publishedPath(pick, problem){
  const classes = Flow.publishedAnswers(pick).classes;
  if(!classes.length){ logUi("publishedPath: no answers on the hit"); return "none"; }

  // **The question is asked in the person's words, not in the publisher's
  // identifiers.** A class is `engram.llm.model-not-pulled` because a rule
  // matches on it and a solution answers it, and for a long time three such
  // strings in a dropdown were the whole of what this asked — a question about
  // your own computer that nobody outside the project could answer.
  //
  // So the maintainer's sentence leads, the identifier stays under it rather
  // than disappearing (it is what travels, and what a support conversation
  // quotes), and a list of a few things to recognise is a list rather than a
  // dropdown. Where nobody wrote a sentence — every manifest published before
  // `class_labels` existed — the identifier leads on its own, which is exactly
  // what this window did before.
  const labels = Flow.publishedAnswers(pick).labels;

  // **The sentence is publisher text, so it is translated like the rest of it.**
  // A project owes English and nothing more (`LG7`), and everything else it
  // writes — a probe's `describes`, its `why`, the answer itself — already
  // reaches a reader in their own language through their own model, with the
  // original one click away. This was the first publisher sentence a person
  // meets and it was the one left in English.
  //
  // **The glossary is here now, and it used to be the one place it was not.**
  // It lives on the card, the card is fetched further down under a consent
  // this question comes before, and so the first publisher sentence anybody
  // reads was the only one translated with nothing keeping its terms — which
  // is exactly the failure `LG8` measures: `brain` arriving as an organ. The
  // index entry carries it beside `answer_labels` now, because that is the
  // same data on the same trip, already fetched and already signed, and
  // reading a directory asks the project nothing.
  const KEEP_EARLY = Flow.publishedGlossary(pick);
  const labels_t = {};
  const toTranslate = classes.filter(c => labels[c]);
  if(toTranslate.length && await publisherModel()){
    const th = add(`<p class="why"><span class="spin"></span> ${esc(t("pub_translating"))}</p>`, "panel");
    try{
      const src = {};
      toTranslate.forEach((c,i)=>{ src["c"+i] = labels[c]; });
      const {texts:out, lost} = await awaitOrCancel(translateKeeping(src, KEEP_EARLY), th);
      toTranslate.forEach((c,i)=>{ if(out["c"+i]) labels_t[c] = out["c"+i]; });
      th.remove();
      if(Object.keys(labels_t).length) showTranslated();
      // Said rather than hidden, the same as every other publisher
      // translation. A term the model dropped anyway is the reader's business.
      if(lost && lost.length) add(termsLostLine(lost), "panel");
    }catch(e){
      if(e instanceof Cancelled) throw e;
      // The publisher's English is a worse answer than their German and a far
      // better one than no question at all, so this never stops the path.
      th.remove();
      logUi(`publishedPath: the class sentences were not translated: ${tr(e)}`);
    }
  }
  const el=add(`<h3>${t("pub_h",{v:esc(pick.vendor)})}</h3>
    <p id="pcls_l">${t("pub_1")}</p>
    <ul class="plain choices" role="radiogroup" aria-labelledby="pcls_l">
      ${classes.map((c,i)=>`<li><label><input type="radio" name="pcls" class="pc"
          value="${esc(c)}"${i?"":" checked"}>
        <span><span class="lbl">${labels[c] ? bi(labels[c], labels_t[c]) : esc(c)}</span>${labels[c]
          ? `<br><span class="why">${esc(c)}</span>` : ""}</span></label></li>`).join("")}</ul>
    <div class="btns"><button class="primary allow">${t("pub_yes")}</button>
      <button class="deny">${t("pub_no")}</button></div>`, "panel decide");
  if(!await ask(el)){ el.className="panel"; el.innerHTML=`<h3>${t("pub_skipped_h")}</h3>`;
    // Declined, which is a choice and not a fault. It leaves by the same
    // `false` as the two failures below, so only the log tells them apart.
    logUi("publishedPath: the person declined the published answers"); return "declined"; }
  const cls = (el.querySelector("input.pc:checked") || {}).value || classes[0];

  // The project's own files: what it asks to have read, and — through the ids —
  // how each fact is coarsened before it may travel. Without them this path
  // asked a person for facts a reading would have given (`os.name`, typed into
  // a box) and built its report from a skill it never had, which dropped every
  // fact on the way out.
  let card=null;
  // `subjectOf`, not `domain`: for a repository the host is the forge and is
  // shared by everything on it, so the operator refuses it. The identity is what
  // was verified and what the mirror answers for.
  try{ card=await invoke("published_card",{base:SERVER_URL, host:subjectOf(pick)}); }
  catch(e){ UNREACHABLE_WHY = tr(e && e.message || e);
    logUi(`publishedPath: published_card failed: ${UNREACHABLE_WHY}`); return "unreachable"; }
  SKILL={id:cls, version:card.commit||"", probes:(card.collect||[]).map(p=>({...p}))};
  // Kept where the rest of the flow can reach it. The model path needs the
  // project's own published words, and until now the card died with this
  // function — so a model was asked about `engram.embedding_changed` without
  // ever being told what that means or whose project it is.
  CARD = card;
  // A project owes English and nothing more. Without a model of their own the
  // reader meets its questions and its answer as written, and is told so
  // once rather than left to wonder why the window changed language.
  let saidEnglish=false;
  const sayEnglish=async()=>{
    if(saidEnglish || LANG==="en" || await publisherModel()) return;
    saidEnglish=true;
    add(`<p class="why c-warn">${t("pub_english_no_model")}</p>`, "panel");
  };
  // The project's own terms — a feature, a file format — kept as written by
  // whatever model translates its words (`LG8`).
  const KEEP = (card.glossary && Array.isArray(card.glossary.keep)) ? card.glossary.keep : [];
  if(SKILL.probes.length) await sayEnglish();
  await translatePublisher(SKILL.probes, KEEP);
  if(SKILL.probes.length && !await collectFacts(SKILL.probes, pick.vendor)){
    logUi("publishedPath: the readings were not collected"); return "reads"; }

  // Nothing leaves before this. The readings and the answers go to the
  // operator that mirrors the project — a third party the person has not
  // yet been told about — and every other path asks before its first send.
  // This one asked the operator straight after the readings. Refusing ends
  // the run: a person who will not send the values to the operator has not
  // asked for a model to see them instead.
  // As on the vendor path: what the panel showed is the object that travels,
  // rather than a second read of one that could have moved since.
  const sent=await asSent(FACTS);
  let SHOWN=sent.facts;
  const tx=add(`<h3>${t("pub_send_h",{o:esc(operatorHost())})}</h3>
    <p>${t("pub_send_1",{v:esc(pick.vendor), o:esc(operatorHost())})}</p>
    <ul class="plain">${Object.keys(SHOWN).map(k=>{const l=label(k);
      return `<li><span><span class="lbl">${esc(l.t)}</span>${l.w?`<br><span class="why">${esc(l.w)}</span>`:""}</span></li>`;}).join("")}</ul>
    <p class="why">${esc(replacedLine(sent.replaced))}</p>
    <details class="more"><summary>${t("exact_values")}</summary>${kvl(SHOWN)}</details>
    ${editableIn(SHOWN).length?`<details class="more"><summary>${t("edit_mine")}</summary>
      <p class="why">${t("edit_mine_1")}</p>
      ${editableIn(SHOWN).map(k=>{const lid=qid(); return `<div class="qb">
        <div class="lbl" id="${lid}">${esc(label(k).t||k)}</div>
        ${textInput("sv", k, "", 3, lid)}</div>`;}).join("")}</details>`:""}
    <div class="btns"><button class="primary allow">${t("send_yes")}</button>
      <button class="deny">${t("cancel")}</button></div>`, "panel decide", "pubsend");
  tx.querySelectorAll("textarea.sv").forEach(a=>{ a.value = SHOWN[a.dataset.id] || ""; });
  if(!await ask(tx)){
    tx.className="panel stop";
    tx.innerHTML=`<h3>${t("send_none_h")}</h3><p>${t("pub_send_none_1",{o:esc(operatorHost())})}</p>`;
    logUi("publishedPath: the person refused to send, which is an answer");
    return "answered";
  }
  const edits={};
  tx.querySelectorAll("textarea.sv").forEach(a=>{ edits[a.dataset.id]=a.value; });
  SHOWN=Flow.applyEdits(SHOWN, edits);
  // The operator is a third party the person was not told about until this
  // panel named it, so this panel is the whole of why anything may go there.
  CONSENT.grant("operator", SHOWN);

  // The third outcome — "I still need X" — is answered through the same loop
  // the vendor path uses, so a question here costs no second mechanism. An
  // answer given in that loop was asked for in the operator's name and goes
  // the way the panel above said.
  let out=null;
  for(let round=0; round<3; round++){
    try{
      out=await invoke("ask_published",{base:SERVER_URL, subject:subjectOf(pick),
        problemClass:cls, facts:CONSENT.factsFor("operator"), stated:[...STATED]});
    }catch(e){
      UNREACHABLE_WHY = tr(e && e.message || e);
      logUi(`publishedPath: ask_published failed on round ${round}: ${UNREACHABLE_WHY}`);
      return "unreachable";
    }
    if(out.outcome!=="need") break;
    if(!await askOneProbe(out.need[0], out.need_reason, pick.vendor)) break;
    // Asked in the operator's name and answered, so it goes the way the panel
    // above said it would — and is granted again, because the gate holds a copy
    // and an answer nobody showed must not ride along on the next round.
    Object.assign(SHOWN, FACTS);
    CONSENT.grant("operator", SHOWN);
  }

  if(!out || out.outcome!=="finding"){
    add(`<h3>${t("pub_none_h")}</h3><p>${esc((out&&out.reason)||"")}</p>
      <p class="why">${t("pub_none_1")}</p>`,"panel");
    // The project published answers and the walk over them reached none. This
    // is a finding about the project's own files rather than about this client,
    // and it is the one exit here a publisher can act on — so it says what the
    // walk ended as and on which class it was asked.
    logUi(`publishedPath: no finding for class=${cls}, outcome=${out ? out.outcome : "no answer"}`);
    return "nofinding";
  }

  // What the answer turned on, kept for the report. With STATED this is what
  // lets the publisher tell an outcome that tests their rule from one that
  // tests whether somebody answered a question right.
  DECIDED = out.decided_on || [];
  const sol = out.solution || {};
  const text = (sol.text_by_lang && (sol.text_by_lang[LANG]||sol.text_by_lang.en)) || "";
  // Not written in this language: the reader's own model may say it in theirs,
  // marked as such and with the original one click away. The answer itself
  // was still matched without any model; only the wording is translated.
  const inLang = !!(sol.text_by_lang||{})[LANG];
  if(!inLang) await sayEnglish();
  const textT = inLang ? null : await translatePublisherText(text, KEEP);
  const answered=add(`<h3>${t("pub_found_h")}</h3>
    <p class="why">${t("pub_found_1",{v:esc(pick.vendor), c:esc(sol.commit||"")})}</p>
    ${textT?`<p class="why c-warn">${esc(t("pub_translated"))}</p>`:""}
    ${textT?termsLostLine(textT.lost):""}
    ${attestationLine(card, pick.domain)}
    <div class="answer">${biBlock(md(text), textT && md(textT.text))}</div>
    ${out.confidence==="rests_on_supplied"
      ? `<p class="why c-warn">${esc(t("pub_supplied",
          {list:(out.rested_on_supplied||[]).join(", ")}))}</p>` : ""}`, "panel done");
  // Not awaited: the answer is readable while the proof is fetched.
  checkLogEntry(answered, card);
  // **Here, not at the end of the function.** This was written after
  // `offerIssueReport`, which waits for the person to say whether the answer
  // helped — so somebody who read their answer and closed the window left no
  // record that the published path had answered at all. The claim is true the
  // moment the project's text is on the screen; what comes after it is theirs
  // to do or not.
  logUi(`publishedPath: answered from the project's own files, class=${cls}`);

  // Whether it worked is the person's to say, after trying. It was sent as
  // `resolved` the moment the text appeared — before anybody had tried it —
  // and that label is the most valuable column the maintainer's dashboard
  // has: "your answer worked for 0 of 6" is only true if it was asked.
  const oc=add(`<h3>${t("pub_try_h")}</h3><p>${t("pub_try_1",{v:esc(pick.vendor)})}</p>
    <div class="btns"><button class="primary" data-o="resolved">${t("pub_try_yes")}</button>
      <button class="ghost" data-o="unresolved">${t("pub_try_no")}</button>
      <button class="deny" data-o="">${t("pub_try_skip")}</button></div>`, "panel decide");
  const outcome=await new Promise(res=>{
    oc.querySelectorAll("button[data-o]").forEach(b=>b.onclick=()=>{ settle(oc); res(b.dataset.o); });
    oc.querySelector(".deny").focus();
  });
  oc.className="panel";
  oc.innerHTML=`<h3>${outcome==="resolved"?t("pub_try_yes_h"):outcome==="unresolved"?t("pub_try_no_h"):t("pub_try_skip_h")}</h3>`;
  if(outcome) await offerPublishedReport(pick, outcome);
  // Offered whether or not they reported: the two are different acts. One tells
  // the operator's counts something; this one is theirs to keep.
  await offerIssueReport(pick, problem, outcome, text, false, (card.escalate||{}).target);
  return "answered";
}

/* A publisher's words in the reader's language, by the reader's own model.

   A published project owes English and nothing more, so a person reading this
   window in German, French or Spanish met every question and every answer in
   English while the window around them was in their language. Where a model
   is set up it translates — the same switch as a vendor's skill: marked, with
   the original one click away, because a consent decision must never rest on
   a translation nobody can check. `choices` are never translated: the answer
   that is recorded has to be the publisher's own word, or one situation splits
   into as many as there are languages. Without a model nothing changes. */
async function publisherModel(){
  if(LANG === "en") return null;
  const cfg = await llmGet();
  return cfg.configured ? cfg : null;
}
function showTranslated(){
  TRANSLATED = true;
  $("origtab").hidden = false;
  $("origtab").textContent = document.body.classList.contains("orig") ? t("tab_yours") : t("tab_orig");
}
/* `keep` is the project's glossary: its own terms, which the model is told to
   leave as written. A term it changed anyway is said, not hidden — a *cerveau*
   where the project wrote *brain* reads as a statement about an organ. */
function termsLostLine(lost){
  return (lost && lost.length)
    ? `<p class="why c-warn">${esc(t("pub_terms_lost",{list:lost.join(", ")}))}</p>` : "";
}
async function translatePublisher(probes, keep){
  if(!probes.length || !await publisherModel()) return false;
  const src = {};
  probes.forEach((p,i)=>{
    if(p.describes) src["d"+i]=p.describes;
    if(p.why) src["w"+i]=p.why;
    if(p.prompt) src["p"+i]=p.prompt;
  });
  const th = add(`<p class="why"><span class="spin"></span> ${esc(t("pub_translating"))}</p>`, "panel");
  try{
    const {texts:out, lost} = await awaitOrCancel(translateKeeping(src, keep), th);
    probes.forEach((p,i)=>{ p.describes_t=out["d"+i]; p.why_t=out["w"+i]; p.prompt_t=out["p"+i]; });
    th.remove(); showTranslated();
    if(lost.length) add(termsLostLine(lost), "panel");
    return true;
  }catch(e){
    if(e instanceof Cancelled) throw e;
    th.innerHTML = esc(t("pub_tr_failed")); th.className = "panel";
    th.title = tr(e);
    return false;
  }
}
async function translatePublisherText(text, keep){
  if(!text || !await publisherModel()) return null;
  try{
    const {texts:out, lost} = await translateKeeping({text}, keep);
    if(!out || typeof out.text !== "string" || !out.text.trim()) return null;
    showTranslated();
    return {text: out.text, lost};
  }catch(_){ return null; }
}
/// `bi` for a block of markup already made safe — a solution rendered by `md`.
function biBlock(origHtml, transHtml){
  if(!TRANSLATED || !transHtml) return origHtml;
  return `<div class="bi"><div class="bi-t">${transHtml}</div><div class="bi-o" lang="en">${origHtml}</div></div>`;
}

/* What the operator attests about whoever published this, and nothing more:
   that somebody controls the location, when that was last confirmed, and the
   project's own word about itself. The window knew only a vendor's key —
   verified or untrusted — and could not say "confirmed three weeks ago", which
   is the thing a person weighing a stranger's advice can actually use. A
   deprecated project's answer is still shown; its age is not a verdict. */
function attestationLine(card, host){
  const a=(card&&card.anchor)||{}, p=(card&&card.project)||{};
  const day=String(a.last_confirmed||"").slice(0,10);
  const parts=[];
  if(a.status==="live") parts.push(t("att_live",{h:esc(host), d:esc(day)}));
  else if(a.status==="stale") parts.push(t("att_stale",{h:esc(host), d:esc(day)}));
  else parts.push(t("att_unknown",{h:esc(host)}));
  if(card && card.log_seq!=null) parts.push(t("att_log",{n:esc(card.log_seq)}));
  if(p.declared_status==="deprecated")
    parts.push(p.successor ? t("att_deprecated_to",{s:esc(p.successor)}) : t("att_deprecated"));
  else if(p.forge_archived===true) parts.push(t("att_archived"));
  const warn = a.status!=="live" || p.declared_status==="deprecated" || p.forge_archived===true;
  return `<p class="why${warn?" c-warn":""}" data-att="${esc(a.status||"unknown")}">${parts.join(" ")}
    ${card && card.log_seq!=null?`<span data-att-proof>${t("att_checking")}</span>`:""}</p>`;
}

/* "Anybody can check" was true of the log and not of this client: nothing on
   the user's side checked anything. Now it does — the signed head against the
   pinned key, the entry's inclusion for exactly that head, and that the entry
   attests the files being served — and says which it was. A failure is shown,
   not hidden: an answer whose log entry does not prove is still the publisher's
   text, and the person should know that nobody can vouch for it. */
async function checkLogEntry(panel, card){
  const slot=panel && panel.querySelector("[data-att-proof]");
  if(!slot || !card || card.log_seq==null) return;
  try{
    const r=await invoke("verify_log_entry",{base:SERVER_URL, seq:card.log_seq,
      expected:{content_sha256:card.content_sha256||null, commit:card.commit||null}});
    slot.textContent=t("att_proved",{n:r.tree_size});
    slot.dataset.attProof="ok";
  }catch(e){
    slot.textContent=t("att_unproved");
    slot.title=tr(e);
    slot.className="c-stop";
    slot.dataset.attProof="failed";
  }
}

/* The report about a published project, to the operator that mirrors it — the
   same policy and the same two maps as every other report, and free text only
   on its own consent, anonymised first.

   This path called `offerReport`, which sends A2A to a vendor's agent at the
   project's own address — where no agent exists — built from a skill the
   published path never had, so every fact was dropped on the way and the send
   failed. The one branch whose offer is "the maintainer finally hears about
   it" could not deliver a single report. */
/* The exit that did not exist. A diagnosis ended and the only way out was a
   pseudonymous report to the operator — which is the wrong shape for the case
   the whole open-source branch rests on: the published answers did not cover
   somebody's problem, and they now hold more about it than they could have
   assembled in an hour, with nowhere to put it.

   Shown before it is copied, and editable, for the reason the log-excerpt panel
   is: this is *more* public than a report. A report goes to one operator under a
   pseudonym; this goes into an issue tracker anybody can read, for ever, with
   the person's own name on it. So it says what the anonymiser took out, in the
   same words the consent panel uses, about a larger audience. */
async function offerIssueReport(pick, problem, outcome, answer, fromModel, target){
  const r = await invoke("issue_report", {
    subject: `${pick.vendor}`, problem: problem || "", facts: FACTS,
    stated: [...STATED], outcome: outcome || "", answer: answer || "",
    answerFromModel: !!fromModel, tried: [], footer: true });
  const took = Object.entries(r.replaced || {});
  // **Where it goes, in the project's own words.** A maintainer writes
  // `escalate.target` into their manifest, ingest validates and stores it, the
  // mirror serves it on the card -- and this panel used to say "take this to
  // the project" without ever saying where. Somebody was handed a finished bug
  // report and left to find the tracker themselves, past a project that had
  // already written the address down.
  //
  // Shown, not opened: this client cannot open a browser and should not learn
  // to from a publisher-supplied string. The person copies the text and goes
  // where it says.
  const dest = typeof target === "string" && /^https:\/\//.test(target) ? target : "";
  const el = add(`<h3>${t("issue_h")}</h3><p>${t("issue_1")}</p>
    ${dest?`<p class="why">${esc(t("issue_where",{d:dest}))}</p>`:""}
    <p class="why">${t("issue_en")}</p>
    ${took.length?`<p class="why">${esc(t("issue_took",
        {list: took.map(([k,n])=>`${n}\u00d7 ${label(k).t||k}`).join(", ")}))}</p>`:""}
    ${(r.unstated_versions||[]).length?`<p class="why c-warn">${esc(t("issue_unstated",
        {list: r.unstated_versions.join(", "),
         n: r.unstated_versions.length===1?"It appears":"They appear",
         n2: r.unstated_versions.length===1?"it":"them"}))}</p>`:""}
    <textarea class="field" id="issuemd" rows="14" spellcheck="false"></textarea>
    <label class="why"><input type="checkbox" id="issuefoot" checked> ${t("issue_footer")}</label>
    <div class="btns"><button class="primary" id="issuecopy">${t("issue_copy")}</button>
      <button class="deny" id="issueclose">${t("issue_close")}</button></div>`, "panel decide");
  const box = el.querySelector("#issuemd");
  box.value = r.markdown;
  // The words are the binary's, returned beside the markdown they are in. This
  // used to be the same sentence written out again here as a regex, twice, and
  // the way that breaks is silent in the direction that matters: reword it in
  // `issue.rs` and unchecking the box removes nothing while the label goes on
  // saying it did.
  el.querySelector("#issuefoot").onchange = e => {
    box.value = Flow.footerToggle(box.value, r.footer, e.target.checked);
  };
  el.querySelector("#issuecopy").onclick = async () => {
    // What is copied is what is in the box, not what was generated: the person
    // may have edited it, and copying the original would send something they
    // did not read.
    try { await navigator.clipboard.writeText(box.value); } catch(e) {
      box.select(); document.execCommand("copy");
    }
    el.querySelector("#issuecopy").textContent = t("issue_copied");
  };
  await new Promise(res => { el.querySelector("#issueclose").onclick = () => { settle(el); res(); }; });
}

/* **Nothing published covered this, and somebody has to hear that.**

   Every other report on this path is about an answer: it worked, it did not,
   it was handed on. This one is about there being no answer — the person was
   shown what the project wrote up and said none of it is their problem, or the
   rules ran over the readings and produced nothing.

   It is the one thing a maintainer cannot find out for themselves. Asking the
   catalogue runs in a read-only transaction and leaves no trace at all, and
   nobody opens an issue titled "your support page did not have my case on it";
   they close the window. So the gap in the published answers — which is the
   only thing that tells a maintainer to write a new one — was the single event
   that never reached them.

   The two branches send the same word, `uncovered`, and differ in what they
   carry, which is the honest difference rather than a second label: declining
   happens at the class picker, before anything is read, so that report holds no
   readings; rules matching nothing happens after, so that one holds exactly the
   constellation they failed on.

   Separate from the issue text that follows, and said so on both panels: this
   is a count with no words in it, that one is words that go nowhere until the
   person pastes them. Somebody walking the real window read the two as one
   thing and could not tell what had already been sent. */
async function offerUncovered(pick, because){
  const declined = because === "declined";
  const pv = await invoke("preview_report", {skill: SKILL || null, facts: FACTS,
    stated: [...STATED], decidedOn: DECIDED,
    resolvedBy: declined ? "person" : "vendor_skill", outcome: "uncovered"});
  const measured = Object.keys(pv.report.observed || {}).length
                 + Object.keys(pv.report.stated || {}).length;
  const el = add(`<h3>${t(declined ? "unc_declined_h" : "unc_nomatch_h", {v:esc(pick.vendor)})}</h3>
    <p>${t(declined ? "unc_declined_1" : "unc_nomatch_1", {v:esc(pick.vendor)})}</p>
    <p class="why">${t("unc_2")}</p>
    ${measured ? `<details class="more"><summary>${t("report_what")}</summary>
        <div class="lbl">${t("pub_measured")}</div>${kvl(pv.report.observed)}
        <div class="lbl mt3">${t("pub_stated")}</div>${kvl(pv.report.stated)}
        ${pv.held_back.length?`<p class="why mt3">${esc(t("report_held",{list:pv.held_back.map(k=>label(k).t).join(", ")}))}</p>`:""}
        </details>`
      : `<p class="why">${t("unc_nothing",{v:esc(pick.vendor)})}</p>`}
    <div class="btns"><button class="primary allow">${t("unc_yes")}</button>
      <button class="deny">${t("unc_no")}</button></div>`, "panel decide");
  if(!await ask(el)){
    el.className="panel";
    el.innerHTML=`<h3>${t("report_none_h")}</h3><p>${t("report_none_1")}</p>`;
    logUi(`uncovered (${because}): the person chose not to tell ${pick.vendor}`);
    return;
  }
  el.className="panel";
  try{
    const r=await invoke("send_published_report",{base:SERVER_URL, subject:subjectOf(pick),
      report: pv.report});
    if(r.accepted===false || r.code) throw new Error(r.reason||r.code);
    logUi(`uncovered (${because}) sent about ${subjectOf(pick)} — ${measured} value(s), surfaced=${!!r.surfaced}`);
    el.innerHTML=`<h3>${t("unc_sent_h")}</h3><p>${r.surfaced
      ? t("pub_ok_yes",{n:esc(r.reporters), v:esc(pick.vendor)})
      : t("pub_ok_below")}</p>
      ${r.counted===false?`<p class="why">${t("pub_ok_again")}</p>`:""}
      <p class="why">${t("unc_next")}</p>`;
  }catch(e){
    logUi(`uncovered (${because}) failed: ${tr(e && e.message || e)}`);
    el.innerHTML=`<h3>${t("err_h")}</h3><p>${esc(tr(e && e.message || e))}</p>`;
  }
}

async function offerPublishedReport(pick, outcome){
  const pv=await invoke("preview_report",{skill:SKILL, facts:FACTS, stated:[...STATED],
    decidedOn:DECIDED, resolvedBy:"vendor_skill", outcome});
  const el=add(`<h3>${t("pub_report_h",{v:esc(pick.vendor)})}</h3><p>${t("pub_report_1",{v:esc(pick.vendor)})}</p>
    <p class="why">${t("report_2")}</p>
    <details class="more"><summary>${t("report_what")}</summary>
      <div class="lbl">${t("pub_measured")}</div>${kvl(pv.report.observed)}
      <div class="lbl mt3">${t("pub_stated")}</div>${kvl(pv.report.stated)}
      ${pv.held_back.length?`<p class="why mt3">${esc(t("report_held",{list:pv.held_back.map(k=>label(k).t).join(", ")}))}</p>`:""}
      <p class="why" id="pseudo"></p></details>
    <div class="btns"><button class="primary allow">${t("report_yes")}</button>
      <button class="deny">${t("report_no")}</button></div>`, "panel decide");
  invoke("identity_info",{domain:pick.domain}).then(i=>{
    const slot=el.querySelector("#pseudo");
    if(slot) slot.innerHTML=`<code>${esc(i.pseudonym)}</code> (${esc(i.epoch)}) — ${esc(t("pseudo_explain"))}`;
  });
  if(!await ask(el)){ el.className="panel"; el.innerHTML=`<h3>${t("report_none_h")}</h3><p>${t("report_none_1")}</p>`; return; }

  const dest=t("pub_dest",{v:pick.domain});
  const report=await offerFreeText(pv, {org:pick.vendor}, dest);
  // The receipt is its own panel, last — not written back into the consent
  // panel above the free text, where it read as coming before the question it
  // followed. And it is not "a reply from the vendor": there is no vendor here.
  el.className="panel";
  try{
    const r=await invoke("send_published_report",{base:SERVER_URL, subject:subjectOf(pick), report});
    if(r.accepted===false || r.code) throw new Error(r.reason||r.code);
    add(`<h3>${t("pub_receipt_h")}</h3><p>${r.surfaced
      ? t("pub_ok_yes",{n:esc(r.reporters), v:esc(pick.vendor)})
      : t("pub_ok_below")}</p>
      ${r.counted===false?`<p class="why">${t("pub_ok_again")}</p>`:""}`, "panel done");
  }catch(e){
    add(`<h3>${t("err_h")}</h3><p>${esc(tr(e && e.message || e))}</p>`, "panel stop");
  }
}

/* One probe the diagnosis still needs. Read if it can be read — under the same
   consent as every other reading — and asked only if not: the `need` names a
   probe from the project's own `collect`, and it used to go straight to a
   question, so a person typed their operating system into a box that
   `os_fact` answers without asking anybody. Bounded answers get the
   publisher's list; anything else is free text, which is withheld unless the
   user later says otherwise. */
async function askOneProbe(p, why, org){
  const own=(SKILL&&SKILL.probes||[]).find(x=>x.id===p.id) || p;
  if(own.read && !(own.id in FACTS)){
    await collectFacts([{...own, kind:"machine"}], org||"");
    if(!(own.id in FACTS)) FACTS[`${own.id}.declined`]=true;
    return true;
  }
  p=own;
  const id=qid();
  const el=add(`<h3>${t("ask_you_h")}</h3><p>${esc(why||"")}</p>
    <div class="lbl" id="${id}">${bi(p.prompt||p.describes||p.id, p.prompt ? p.prompt_t : p.describes_t)}</div>
    ${Array.isArray(p.choices)&&p.choices.length
      ? `<select class="ai field" data-id="${esc(p.id)}" aria-labelledby="${id}">
          <option value="">${esc(t("q_pick"))}</option>
          ${p.choices.map(c=>`<option>${esc(c)}</option>`).join("")}</select>`
      : textInput("ai",p.id,p.example||t("q_ph"),2,id)}
    <div class="btns"><button class="primary allow">${t("next")}</button>
      <button class="deny">${t("need_skip")}</button></div>`, "panel decide");
  const ok=await ask(el);
  if(!ok){
    // "Don't know" is an answer and must not dead-end: the endpoint ships a
    // fallback with every question and honours a declined fact.
    FACTS[`${p.id}.declined`]=true;
    el.className="panel"; el.innerHTML=`<h3>${t("need_skipped_h")}</h3>`;
    return true;
  }
  const f=el.querySelector(".ai");
  if(f && f.value.trim()){ FACTS[p.id]=f.value.trim(); STATED.add(p.id); }
  el.className="panel"; el.innerHTML=`<h3>${t("ask_ok_h")}</h3>`;
  return true;
}

/// What the project published about itself, for a model that is about to guess.
///
/// **The model used to be told nothing.** It got a problem sentence and a map
/// of facts called `engram.embedding_changed`, and was asked to reason about
/// software whose name nobody had given it, using field names whose meaning the
/// maintainer had written down and we kept. It guessed badly, which is what a
/// person on the first Omarchy desktop said in those words.
///
/// Everything here is already on this machine and already public: it came off
/// the mirrored card under the same fetch that drove the published path. Only
/// what the project wrote — never the solution bodies, which is a decision
/// about volume and a separate one.
///
/// **What is deliberately not here is a pointer.** Naming only the repository
/// would be worse than silence: the agent runs with every tool denied, so it
/// cannot look anything up, and asked about `github.com/owner/name` a model
/// answers from whatever it half-remembers — which for an obscure project is
/// invention that reads like knowledge. `llm.rs` says so in the prompt itself.
function projectContext(pick){
  if(!pick) return null;
  // **Built from the hit first, and the card only if it is there.**
  //
  // The first version required `CARD`, and on the path that matters most it is
  // null: somebody who says "none of these fit" is answering the class picker,
  // which comes *before* the card is fetched. So the model was handed nothing,
  // exactly as before, and the log said so — `declined` with no `card` line
  // above it. The fix looked right and changed nothing, which is the worst
  // shape a fix can have.
  //
  // The hit carries what matters here anyway: the classes, the maintainer's
  // sentence for each, and the glossary. The card adds what the fields mean,
  // and is fetched by then on every other path.
  const { classes: ids, labels } = Flow.publishedAnswers(pick);
  const classes = ids.map(c => labels[c] ? `${c} — ${labels[c]}` : c);
  const means = ((CARD && CARD.collect) || []).map(p => {
    const what = [p.describes, p.why].filter(Boolean).join(" — ");
    return what ? `${p.id}: ${what}` : "";
  }).filter(Boolean);
  if(!classes.length && !means.length) return null;
  return {
    name: pick.vendor,
    anchor: pick.base || "",
    classes,
    rejected: REJECTED,
    means,
    keep: Flow.publishedGlossary(pick),
  };
}

/* -------------------------------------------- no vendor: the model leads */
async function noVendorPath(pick, problem, reason){
  // "Does not publish a support agent" is only news when nothing else was
  // published. Shown above a project's own answers it read as "this project
  // has no files", beside the panel offering those files — so it waits until
  // the published path is not taken.
  const saidNoAgent=()=>add(`<h3>${t("noagent_h",{v:esc(pick.vendor)})}</h3>
    <p>${t("noagent_1",{r:esc(reason)})}</p>
    <p class="why">${t("noagent_2")}</p>`, "panel stop");
  const published = Flow.publishedAnswers(pick).classes.length > 0;
  // The gate the 2026-09-14 log could not show: what the hit carried by the
  // time *the window* read it, rather than what the binary logged returning.
  logUi(`noVendorPath vendor=${pick.vendor} answers=${Array.isArray(pick.answers)
    ? pick.answers.length : `not-an-array(${typeof pick.answers})`} published=${published}`);

  // **Why nothing was found, when nothing was found.** "Does not publish a
  // support agent" is about one thing — an Agent Card — and it was being shown
  // for every other reason as well, including the two that are ours: no
  // verified directory to search, or a directory that has this project without
  // any answers in it. A person then reads that a project publishes nothing
  // while it publishes three answers, and there is nothing on the screen to
  // contradict them. The console said so; nobody reads a console.
  const before = Flow.planBefore(pick, published
    ? null : await invoke("index_status").catch(()=>({have:false,entries:0})));
  if(before.kind === "nothing-published"){
    const st = {have: before.directory === "holds-entries", entries: before.entries};
    if(!st.have){
      add(`<h3>${t("nodir_h")}</h3><p>${t("nodir_1")}</p>
        <p class="why">${t("nodir_2")}</p>`, "panel stop");
    } else {
      add(`<p class="why">${esc(t("nodir_3",{n:st.entries}))}</p>`, "panel");
    }
    saidNoAgent();
  }

  // A published answer first, and a model only if there is none. This is the
  // open-source path and the common one: somebody wrote the answer down, we
  // mirror it, and the decision is a walk over what they wrote. Nothing is
  // generated, and a user with no model configured gets the whole of it.
  let took = await publishedPath(pick, problem);
  logUi(`publishedPath -> ${took}`);
  let plan = Flow.planAfter(took, {published, why: UNREACHABLE_WHY});

  // **An operator that did not answer is not a project that published nothing,
  // and a timeout is not somebody asking for a model.** The window used to say
  // both: "the catalogue is not answering", then "this project does not publish
  // a support agent" two lines under it, and then it started a model by itself.
  // The person was told the opposite of the truth about the project and had a
  // model chosen for them by a network failure.
  //
  // Trying again is the whole remedy when the reason is a name that resolves to
  // the wrong address for five minutes, so it is offered first and the refusing
  // button keeps the focus.
  while(plan.kind === "offer-retry"){
    const el=add(`<h3>${t("pub_unreach_h")}</h3>
      <p>${t("pub_unreach_1",{v:esc(pick.vendor), o:esc(operatorHost())})}</p>
      <p class="why">${t("pub_unreach_2")}</p>
      ${UNREACHABLE_WHY ? `<details class="more"><summary>${t("pub_unreach_detail")}</summary>
        <p class="why">${esc(UNREACHABLE_WHY)}</p></details>` : ""}
      <div class="btns"><button class="primary allow">${t("pub_unreach_again")}</button>
        <button class="deny">${t("pub_unreach_stop")}</button></div>`, "panel decide");
    if(!await ask(el)){
      logUi("stopped: the catalogue was unreachable and the person did not retry");
      add(`<h3>${t("pub_unreach_stopped_h")}</h3>
        <p>${t("pub_unreach_stopped_1",{o:esc(operatorHost())})}</p>`, "panel stop");
      return;
    }
    took = await publishedPath(pick, problem);
    logUi(`publishedPath (retry) -> ${took}`);
    plan = Flow.planAfter(took, {published, why: UNREACHABLE_WHY});
  }
  if(plan.kind === "done") return;

  // **Somebody said none of these fit. That is an answer, not a request.**
  //
  // The window used to start a model here without asking, and on the first
  // Omarchy desktop it ran on that is exactly what went wrong: the person
  // rejected three published classes and a cloud agent began questioning them
  // about a project it had never been told the name of.
  //
  // So the two real options are offered, and the good one leads. Taking it to
  // the project is what "nothing published covers this" actually calls for —
  // the maintainer learns about a case their rules do not answer, which is the
  // only way the published answers ever grow. A model guessing is the other
  // option, named as a guess, for somebody who wants it now.
  if(plan.kind === "offer-elsewhere"){
    const cfg0 = await llmGet();
    // The publisher's own sentence for this case, where they wrote one.
    // `escalate.reason` exists precisely for "nothing published matched", and
    // showing it is the difference between us explaining their project and
    // them explaining it.
    const why = plan.because === "nofinding" ? ((CARD&&CARD.escalate||{}).reason || "") : "";
    const el = add(`<h3>${t(plan.because === "nofinding" ? "no_match_h" : "none_fit_h",
                           {v:esc(pick.vendor)})}</h3>
      <p>${t(plan.because === "nofinding" ? "no_match_1" : "none_fit_1", {v:esc(pick.vendor)})}</p>
      ${why?`<p class="why">${esc(t("no_match_said",{v:esc(pick.vendor), r:tr(why)}))}</p>`:""}
      <p class="why">${t("none_fit_2")}</p>
      <div class="btns"><button class="primary allow">${t("none_fit_issue")}</button>
        ${cfg0.configured?`<button class="deny">${t("none_fit_guess",{m:esc(cfg0.label)})}</button>`:""}</div>`,
      "panel decide");
    const toProject = await ask(el);
    el.className="panel";
    if(toProject || !cfg0.configured){
      el.innerHTML=`<h3>${t("none_fit_issue_h")}</h3>`;
      logUi(`${plan.because} -> the issue report, not a model`);
      // The counted word first, then the words. `tell` comes from `flow.js` so
      // the page cannot decide on its own to stay quiet about a gap.
      if(plan.tell === "uncovered") await offerUncovered(pick, plan.because);
      await offerIssueReport(pick, problem, plan.because, "", false, (CARD&&CARD.escalate||{}).target);
      return;
    }
    el.innerHTML=`<h3>${t("none_fit_guess_h")}</h3>`;
    logUi(`${plan.because} -> the person asked for a guess anyway`);
    // **The card, if this path never fetched one.** Declining happens at the
    // class picker, which is before the card is read — so the model was being
    // told the project's classes and its glossary but not what a single one of
    // its fields means. One call, and only once somebody has asked for a guess:
    // fetching it earlier would be a request nobody needed.
    if(!CARD){
      try{
        CARD = await invoke("published_card",{base:SERVER_URL, host:subjectOf(pick)});
        logUi(`card fetched for the guess: ${(CARD.collect||[]).length} reading(s) described`);
      }catch(e){ logUi(`card for the guess failed: ${tr(e && e.message || e)}`); }
    }
    // What the person already did with those classes is the strongest thing the
    // model can be told, and it is knowable only here.
    REJECTED = plan.because === "declined";
    // And the gap is still a gap. The maintainer hears it from this exit too —
    // not as a separate panel, which would be a third consent on a path that
    // already has two, but as the word on the report this path ends with.
    UNCOVERED = plan.tell || "";
  }

  if(plan.sayNoAgent) saidNoAgent();
  // A project that publishes answers and is handed to a model anyway — now only
  // ever because the person declined, or because nothing published matched.
  logUi(published ? `falling through to the model DESPITE published answers (${took})`
                  : `falling through to the model, nothing published (${took})`);

  // **What the model is told about the project, said once, before any round.**
  //
  // This was logged at `llm_solve`, which is the *last* call on this path —
  // after every question and every reading. So a walk that stopped anywhere in
  // the rounds produced a log with no context line in it, and twice that was
  // read as "the context is missing" when it meant "the walk had not got there
  // yet". Said here, it is the first thing after the decision to use a model.
  const PCTX = projectContext(pick);
  logUi(PCTX
    ? `model context: ${PCTX.name} classes=${PCTX.classes.length} rejected=${PCTX.rejected} means=${PCTX.means.length} keep=${PCTX.keep.length}`
    : "model context: NONE — the model is told nothing about the project");

  const cfg=await llmGet();
  if(!cfg.configured){
    add(`<h3>${t("needllm_h")}</h3><p>${t("needllm_1")}</p>`); return;
  }

  FACTS=await invoke("baseline_facts");
  step("✓", t("platform",{os:FACTS.os, arch:FACTS.arch}), t("platform_note"));

  // Rounds: first establish what is installed, then ask what only matters given
  // that. Each round is consented separately. After a soft limit the user
  // decides whether to continue — three was an arbitrary number of mine, and a
  // diagnosis that stops because of it stops for the wrong reason. The hard cap
  // only exists so a model that never converges cannot loop forever.
  // No hard cap: only the user ends this. Every additional round costs a
  // click, so it is bounded by their patience rather than by a number I made
  // up — and a diagnosis that stops at three stops for the wrong reason.
  const SOFT_ROUNDS = 3;
  const asked = new Set();
  // What the *person* answered, as against what the machine read. Both live in
  // `FACTS` because both are facts, but a cause resting on a typed value is a
  // different claim from one resting on a measurement — the person could have
  // been mistaken — and `SV71` has made that distinction on the published path
  // for a while. This path had nowhere to put it.
  const TYPED = new Set();

  // The one question a person can always answer and no tool ever can, asked
  // first and by us rather than by whichever model is configured. Nothing on
  // this path is vendor-specific, so there is no decision tree to walk and no
  // publisher who has thought about which fact separates their problems — the
  // model is guessing at what to ask, and a small one guesses badly. "What
  // changed" is the question that most often ends the diagnosis on its own,
  // and leaving it to the model means sometimes it is asked fourth and
  // sometimes not at all.
  //
  // The answer is free text the person typed, so it is a `stated` fact the
  // catalogue does not know — it reaches the model on this device and it does
  // not travel. Marked as asked, so no round repeats it.
  {
    const id = qid();
    const cp = add(`<h3>${t("changed_h")}</h3><p class="why">${t("changed_1")}</p>
      <div class="qb"><div class="lbl" id="${id}">${t("changed_q")}</div>
        ${textInput("hq", "change.last", t("changed_ph"), 2, id)}</div>
      <div class="btns"><button class="primary" id="chok">${t("next")}</button>
        <button class="deny" id="chno">${t("changed_none")}</button></div>`);
    asked.add(t("changed_q"));
    await new Promise(res=>{
      const take=()=>{ cp.querySelectorAll(".hq").forEach(i=>{
        if(i.value.trim()) FACTS["change.last"]=i.value.trim(); }); settle(cp); res(); };
      cp.querySelector("#chok").onclick=()=>{ TYPED.add("change.last"); take(); };
      cp.querySelector("#chno").onclick=()=>{ FACTS["change.last"]=t("changed_nothing");
                                              TYPED.add("change.last"); take(); };
    });
  }

  for(let round=1; ; round++){
    if(round > SOFT_ROUNDS){
      const cont=add(`<h3>${t("more_h")}</h3>
        <p>${t("more_1",{m:esc(cfg.label), n:round-1})}</p>
        <div class="btns"><button class="primary allow">${t("more_yes")}</button>
          <button class="deny">${t("more_no")}</button></div>`, "panel decide");
      if(!await ask(cont)) break;
    }
    const th=add(`<h3><span class="spin"></span>
      ${round===1?t("thinking_pick",{m:esc(cfg.label)}):t("thinking_pick_more",{m:esc(cfg.label)})}</h3>`);
    let chosen=null;
    logUi(`round ${round}: asking the model what to read`);
    try{ chosen=await awaitOrCancel(invoke("llm_choose_reads",{problem, known:FACTS, lang:LANG, round, context:PCTX}), th); }
    catch(e){
      if(e instanceof Cancelled) throw e;
      th.className="panel stop";
      th.innerHTML=`<h3>${t("pick_failed_h")}</h3><p>${esc(tr(e))}</p>`; return; }
    // **What it answered.** "It butts in with nonsense" is about these two
    // lists, and until now neither was anywhere but on the screen — so a report
    // of a bad round could not be read without the person retyping it.
    logUi(`round ${round}: reads=[${(chosen.probes||[]).map(p=>p.id).join(", ")}]`
        + ` asks=${(chosen.questions||[]).length} `+ JSON.stringify((chosen.questions||[]).map(q=>q.length>90?q.slice(0,90)+"…":q))
        + `${chosen.done?" done":""}`);
    th.remove();

    // Never ask the same thing twice — neither a value already read nor a
    // question already answered. The read side is filtered on the Rust side;
    // questions are free text and are filtered here.
    // **One question a round, which is what this file already believed.**
    //
    // The round prompt says so in its own comment — *"telling it all three at
    // once produces three shallow questions in one breath; telling it one
    // produces one good one"* — and then put whatever came back on the screen.
    // Measured on the first Omarchy desktop: three questions at once, each
    // over ninety characters, and the instruction asking for one was ignored.
    // An instruction that needs the model to cooperate is not a bound; `LG8`
    // learnt that about glossary terms and it is the same lesson.
    //
    // Nothing is lost by dropping the rest: the next round asks the next thing,
    // and the person decides after each round whether there is one.
    const offered = (chosen.questions||[]).length;
    const fresh = (chosen.questions||[]).filter(q=>!asked.has(q)).slice(0, 1);
    fresh.forEach(q=>asked.add(q));
    chosen.questions = fresh;
    // **What was offered and what was shown, both.** The line above this used
    // to count the model'''s questions before the filter ran, so a log saying
    // `asks=3` meant three were written and said nothing about how many a
    // person saw. Measuring at the convenient place rather than the telling one
    // is the same mistake the context line made twice today.
    logUi(`round ${round}: model offered ${offered} question(s), shown ${fresh.length}`);

    if(chosen.questions && chosen.questions.length){
      const qp=add(`<h3>${t("questions_h",{m:esc(cfg.label)})}</h3><p class="why">${t("questions_1")}</p>
        ${chosen.questions.map(q=>{ const id=qid(); return `<div class="qb"><div class="lbl" id="${id}">${esc(q)}</div>
          ${textInput("hq",q,t("q_ph"),2,id)}</div>`;}).join("")}
        <div class="btns"><button class="primary" id="hqok">${t("next")}</button></div>`);
      await new Promise(res=>{ qp.querySelector("#hqok").onclick=()=>{
        // **An empty box is an answer here too.**
        //
        // It recorded a value and recorded *nothing* for a skip, so the next
        // round saw no trace of the question and asked it again in different
        // words — which is what a person on the first Omarchy desktop met:
        // round 2 repeating all three of round 1's questions, reworded, and
        // reporting `done` while it did so. The exact-string dedup above could
        // not catch a rewording.
        //
        // This is the defect `flow.js` names for the published path — *"An
        // empty answer is an answer … the endpoint was never told and asked
        // again, for ever"* — in the one panel that never went through
        // `Flow.readAnswers`. It does now, so a skipped question becomes
        // `<question>.declined`, travels in `known`, and the model can see it
        // asked and got nothing.
        const asked_now = [...qp.querySelectorAll(".hq")].map(i=>({id:i.dataset.id}));
        const values = {};
        qp.querySelectorAll(".hq").forEach(i=>{ values[i.dataset.id]=i.value; });
        const round=Flow.readAnswers(asked_now, values);
        qp.querySelectorAll(".hq").forEach(i=>
          i.classList.toggle("invalid", round.invalid.includes(i.dataset.id)));
        // **Refused before it is applied, like the other three.** A model's
        // question carries no `pattern`, so today nothing here can be invalid
        // and this cannot fire. It is written anyway because the contract is
        // about the *shape*: three panels learned this rule separately, each
        // after shipping the same defect, and `an_answer_that_misses_its_pattern
        // _is_asked_again` checks every panel rather than the ones that broke.
        // A fourth panel that skipped it would be the fourth to learn it.
        if(!round.ok){ return; }
        Object.assign(FACTS, round.facts);
        round.stated.forEach(id=>TYPED.add(id));
        settle(qp); res(); }; });
    }

    if(chosen.done || !chosen.probes.length){
      if(round===1 && !(chosen.questions||[]).length){
        add(`<h3>${t("nothing_picked_h")}</h3><p class="why">${t("nothing_picked_1")}</p>`,"panel stop");
        break;
      }
      // The model reporting "enough" is a suggestion, not a termination.
      const dp=add(`<h3>${t("model_done_h",{m:esc(cfg.label)})}</h3>
        <p>${t("model_done_1")}</p>
        <div class="btns"><button class="primary allow">${t("more_yes")}</button>
          <button class="deny">${t("more_no")}</button></div>`, "panel decide");
      if(await ask(dp)) continue;
      break;
    }

    const plan=await invoke("plan_reads",{probes:chosen.probes});
    const doable=plan.plan.filter(p=>!p.refused);
    if(!doable.length) break;

    // **Where the values actually go, on the panel where that is decided.**
    //
    // This said `read_own` whatever the model was: *"they go to your own model
    // — not to us and not to {v}"*. With a cloud-backed model that is false,
    // and it is false on the one screen whose entire job is to tell somebody
    // what leaves their machine before it leaves. The Omarchy default agent is
    // cloud-backed, so the first desktop this ran on said it.
    //
    // The binary already knew: `is_cloud()` asks the agent table rather than
    // assuming, with a comment about not leaving this sentence quietly wrong.
    // The window had the value on `cfg` and never read it.
    const rc=add(`<h3>${round===1?t("read_h"):t("read_h_n",{n:round})}</h3>
      <p${cfg.is_cloud?' class="c-warn"':""}>${t(cfg.is_cloud?"read_own_cloud":"read_own",
        {m:esc(cfg.label), v:esc(pick.vendor)})}</p>
      <ul class="plain">${doable.map(readItem).join("")}</ul>
      <div class="btns"><button class="primary allow">${t("read_yes",{n:doable.length})}</button>
        <button class="deny">${t("read_no_more")}</button></div>`, "panel decide");
    liveReadCount(rc);
    const allowed=await pickList(rc);
    if(allowed===null) break;
    const c=await invoke("perform_reads",{probes:chosen.probes, allow:allowed});
    Object.assign(FACTS, c.facts);
    if(Object.keys(c.facts).length){
      step("✓", t("read_done"), t("read_done_note"), readValues(c.facts));
      if(await checkMismatch(pick, c.facts)) return;
    }
  }

  const th=add(`<h3><span class="spin"></span> ${t("thinking",{m:esc(cfg.label)})}</h3>`);
  let sol=null;
  // **Whether the model was told anything about the project, in the log.**
  // Without this the only honest answer to "does it know about engram?" was to
  // read the source and hope — and the first fix for that looked right and
  // changed nothing, because the card it depended on had not been fetched yet.
  // Counts rather than contents: the words are the project public ones, but a
  // log somebody pastes into an issue stays short.
  try{ sol=await awaitOrCancel(invoke("llm_solve",{problem, facts:FACTS, lang:LANG,
                                                   typed:[...TYPED],
                                                   context:PCTX}), th); }
  catch(e){
    if(e instanceof Cancelled) throw e;
    th.className="panel stop";
    th.innerHTML=`<h3>${t("solve_failed_h")}</h3><p>${esc(tr(e))}</p>`; return; }

  let last=sol.answer, sec=sol.sections||null;
  const ful=qid();
  // A section the model left out is left out here: an empty heading would be
  // the window claiming the method was followed when it was not. An answer
  // with no sections at all is shown as it arrived, which is also how a
  // reader sees that the model ignored what it was asked for.
  const method=()=>{ if(!sec || !sec.structured) return md(last);
    const part=(k,key)=>sec[k] ? `<div class="mpart"><div class="mlbl">${t(key)}</div>
      <div>${md(sec[k])}</div></div>` : "";
    return (sec.abstained ? `<div class="mpart"><div class="mlbl">${t("meth_abstained")}</div>
        <div>${md(sec.abstained)}</div></div>` : part("cause","meth_cause"))
      + part("why_not","meth_why_not") + part("next","meth_next") + part("if_wrong","meth_if_wrong"); };
  const rests=()=>{ if(!sec || !sec.confidence || sec.confidence==="unstated") return "";
    const cls = sec.confidence==="measured" ? "why" : "why c-warn";
    return `<p class="${cls}">${t(sec.confidence==="measured"?"meth_measured":"meth_supplied",
      {f:esc((sec.rests_on_ids||[]).join(", "))})}</p>`; };
  const show=el=>{ el.className="panel";
    el.innerHTML=`<h3>${t("answer_h",{m:esc(cfg.label)})}</h3>
      <div class="answer">${method()}</div>
      ${rests()}
      <details class="more"><summary>${t("basis")}</summary>${kv(FACTS)}</details>
      <div class="mt5"><div class="lbl" id="${ful}">${t("followup_h")}</div>
        <div class="why">${t("followup_1")}</div>${textInput("fu","fu",t("followup_ph"),4,ful)}</div>
      <p class="note c-stop" data-msg="fu"></p>
      <div class="btns"><button class="primary fuask">${t("followup_ask")}</button>
        <button class="ghost fudone">${t("followup_done")}</button></div>`; };
  show(th);

  await new Promise(res=>{
    const bind=()=>{
      th.querySelector(".fuask").onclick=async()=>{
        const added=th.querySelector(".fu").value.trim();
        if(!added) return;
        // The answer stays on screen while the model thinks about the
        // addition, and stays if the model fails: a follow-up that could not
        // be answered used to take the first answer with it.
        th.querySelectorAll("button,textarea").forEach(b=>b.disabled=true);
        const wait=add(`<p class="why"><span class="spin"></span> ${t("thinking_more",{m:esc(cfg.label)})}</p>`, "panel");
        // `typed` travels here too, and this is where it matters most: the
        // person has just supplied something, so a follow-up answer is the one
        // most likely to rest on what they said rather than on a measurement.
        try{ const r=await awaitOrCancel(invoke("llm_follow_up",{problem, facts:FACTS,
                     previous:last, added, lang:LANG, typed:[...TYPED],
                     context:PCTX}), wait);
          wait.remove();
          last=r.answer; sec=r.sections||null; show(th); bind();
        }catch(e){
          if(!(e instanceof Cancelled)){
            wait.className="panel stop";
            wait.innerHTML=`<h3>${t("solve_failed_h")}</h3><p>${esc(tr(e))}</p>`;
          }
          th.querySelectorAll("button,textarea").forEach(b=>b.disabled=false);
        }
      };
      th.querySelector(".fudone").onclick=()=>{ settle(th); res(); };
    };
    bind();
  });

  // **What would actually go, asked of the binary that would send it.**
  //
  // This showed `subject` and `model_class` under a summary reading "exactly
  // what would be sent", while the call below handed over every fact the window
  // held. The readings are coarsened and most are dropped, so nothing leaked —
  // but the two lines somebody was shown were the two that do not matter, and
  // the panel said "exactly".
  const nvp = await invoke("preview_without_vendor",{observed:FACTS}).catch(()=>null);
  const el=add(`<h3>${t("catch_h",{v:esc(pick.vendor)})}</h3><p>${t("catch_1")}</p>
    <p class="why">${t("catch_2")}</p>
    <details class="more"><summary>${t("report_what")}</summary>${kv(
      UNCOVERED ? { subject: subjectOf(pick), model_class: cfg.model_class, outcome: UNCOVERED }
                : { subject: subjectOf(pick), model_class: cfg.model_class })}
      ${nvp ? kvl(nvp.observed) : ""}
      ${nvp && nvp.held_back.length
        ? `<p class="why mt3">${esc(t("report_held",{list:nvp.held_back.map(k=>label(k).t).join(", ")}))}</p>`
        : ""}</details>
    <div class="btns"><button class="primary allow">${t("report_yes")}</button>
      <button class="deny">${t("report_no")}</button></div>`, "panel decide");
  if(!await ask(el)){ el.innerHTML=`<h3>${t("report_none_h")}</h3><p>${t("report_none_1")}</p>`; return; }
  try{
    const r=await invoke("report_without_vendor",{base:SERVER_URL, subject:subjectOf(pick),
      modelClass:cfg.model_class, uxSeverity:sol.ux_severity, observed:FACTS,
      outcome:UNCOVERED});
    el.className="panel done";
    // `reporters` is distinct people, not submissions, and `surfaced` is the
    // server applying the floor to that figure — so reporting the same thing
    // twice does not move either one.
    // No count below the floor, and not because it is unknown: the server
    // withholds it on purpose, because "you are the third" is a count about
    // other people's machines, and counting up to the floor one report at a
    // time is how the floor is read from outside. The sentence used to ask for
    // `{n}` and rendered `undefined` at a person.
    el.innerHTML=`<h3>${t("catch_ok_h")}</h3><p>${r.surfaced
      ? t("catch_ok_yes",{n:esc(r.reporters), v:esc(pick.vendor)})
      : t("catch_ok_below")}</p>`;
  }catch(e){ el.className="panel stop"; el.innerHTML=`<h3>${t("err_h")}</h3><p>${esc(tr(e))}</p>`; }
}

/* EN3. The interpreter on the search path is often not the one a project runs.
   Where the two disagree neither is obviously the one meant, so this asks —
   it never picks. A solution keyed on the wrong interpreter is a confidently
   wrong answer, and the whole design would rather be silent than that. */
async function askAboutInterpreter(){
  const r = await invoke("interpreter_conflict",{facts:FACTS});
  if(!r.conflict) return;
  const q = r.question;
  const el = add(`<h3>${t("env_h")}</h3>
    <p>${t("env_1",{host:esc(q.host), project:esc(q.project)})}</p>
    <p class="why">${t("env_why")}</p>
    <div class="btns">${q.choices.map((c,i)=>
      `<button class="${i===0?"primary":"ghost"}" data-c="${i}">${esc(t("env_c_"+c))}</button>`).join("")}
    </div>`, "panel decide");
  const pick = await new Promise(res=>{
    el.querySelectorAll("button[data-c]").forEach(b=>
      b.onclick=()=>{ settle(el); res(+b.dataset.c); });
  });
  // Recorded under its own name and marked as stated. It does **not** overwrite
  // `python.version`: that reading was true of what it read, and a person
  // choosing which interpreter they meant is answering a different question.
  // Letting the answer take the reading's name would make an assertion
  // indistinguishable from a measurement everywhere downstream.
  FACTS["python.environment"] = q.choices[pick];
  STATED.add("python.environment");
  el.className = "panel done";
  el.innerHTML = `<h3>${t("env_ok_h")}</h3><p>${t("env_ok_1",{c:esc(t("env_c_"+q.choices[pick]))})}</p>`;
}

/// A person at a computer names a vendor from memory; the readings do not.
/// Where they disagree, say so and offer the switch — never override, and
/// never continue silently against a false premise.
async function checkMismatch(pick, facts){
  const m = await invoke("vendor_mismatch",{chosen:pick.vendor, facts});
  if(!m.conflict) return false;
  const el=add(`<h3>${t("mismatch_h")}</h3>
    <p>${t("mismatch_1",{chosen:esc(pick.vendor), found:esc(m.found)})}</p>
    <div class="btns">
      <button class="primary allow">${t("mismatch_switch",{found:esc(m.found)})}</button>
      <button class="deny">${t("mismatch_keep",{chosen:esc(pick.vendor)})}</button></div>`,
    "panel stop");
  if(await ask(el)){
    $("vquery").value = m.found;
    el.className="panel";
    el.innerHTML=`<h3>${t("mismatch_switch",{found:esc(m.found)})}</h3>
      <p class="why">${esc(m.found)} — ${t("go")}.</p>`;
    return true;
  }
  return false;
}

/// The hand-off. Everything about it is the vendor's declaration — where it
/// goes, what it needs, how the answer returns — and everything about what
/// leaves is the user's decision.
async function handover(plan, vendorName){
  if(!plan) return false;
  const extra = {};

  // Whatever the vendor needs is asked for as an ordinary probe, so a contact
  // address is validated and consented like any other value rather than being
  // a field this client decided everyone must have.
  if((plan.require||[]).length){
    const need=add(`<h3>${t("esc_h")}</h3><p>${t("esc_1",{r:esc(plan.reason), v:esc(vendorName)})}</p>
      <p class="lbl">${t("esc_need")}</p>
      ${plan.require.map(p=>{ const id=qid(); return `<div class="qb">
        <div class="lbl" id="${id}">${esc(p.describes)}</div>
        <div class="why">${esc(p.why||"")}</div>
        ${p.choices
          ? `<select class="rq field" data-id="${esc(p.id)}" aria-labelledby="${id}">
               <option value="">${esc(t("q_pick"))}</option>
               ${p.choices.map(c=>`<option>${esc(c)}</option>`).join("")}</select>`
          : textInput("rq", p.id, p.example || t("q_ph_req"), 1, id)}
      </div>`;}).join("")}
      <p class="note c-stop" data-msg="rq"></p>
      <div class="btns"><button class="primary" id="rqok">${t("next")}</button></div>`);
    // The mark goes the moment the person starts correcting the answer, so it
    // never stands over a value that is already different.
    need.querySelectorAll(".rq").forEach(i=>i.addEventListener("input",()=>i.classList.remove("invalid")));
    await new Promise(res=>{ need.querySelector("#rqok").onclick=()=>{
      // `required`: here an empty box is not a decline, it is unanswered, and
      // an unanswered required field must not open a case in somebody's name.
      // That is the one thing this round does differently from the questions
      // panel, and it is now the one place either of them says so.
      const values={};
      need.querySelectorAll(".rq").forEach(i=>{ values[i.dataset.id]=i.value||""; });
      const round=Flow.readAnswers(plan.require, values, {required:true});
      need.querySelectorAll(".rq").forEach(i=>
        i.classList.toggle("invalid", round.invalid.includes(i.dataset.id)));
      const note=need.querySelector("[data-msg=rq]");
      if(note) note.textContent = round.ok ? "" : t("q_pattern");
      if(!round.ok) return;                   // caught here, not after a case is opened
      Object.assign(extra, round.facts);
      settle(need);
      res();
    };});
  }

  const ch=await invoke("reply_channels",{offered:plan.reply_via||["none"]});
  const usable=ch.usable.length?ch.usable:["none"];
  const payload={};
  for(const f of (plan.include||[])){
    if(f==="facts_machine"||f==="facts_human") Object.assign(payload, FACTS);
    else if(f==="findings") payload.findings=(LAST_FINDINGS||[]).map(x=>x.summary);
    else if(f==="reported") payload.reported=$("problem").value;
  }
  Object.assign(payload, extra);
  // What a person typed — an answer in their own words, a pasted log, the
  // problem as they described it — is anonymised before it is shown, and
  // shown exactly as it will leave. The hand-off carried the typed text as
  // typed, the one place in the client where free text travelled unread by
  // the anonymiser. The vendor's own required fields — an address to answer
  // to — are not text about the machine and go as given.
  const replaced={};
  for(const k of Object.keys(payload)){
    const typed = (STATED.has(k) || k==="reported") && typeof payload[k]==="string" && payload[k].trim();
    if(!typed) continue;
    const a=await invoke("anonymise_text",{text:payload[k]});
    payload[k]=a.text;
    for(const [kind,count] of Object.entries(a.replaced||{})) replaced[kind]=(replaced[kind]||0)+count;
  }
  const replacedNote = Object.keys(replaced).length
    ? t("anon_done",{list:Object.entries(replaced).map(([k,c])=>t("anon_"+k,{n:c})).join(", ")}) : "";

  const el=add(`<h3>${t("esc_h")}</h3>
    <p>${t("esc_1",{r:esc(plan.reason), v:esc(vendorName)})}</p>
    ${plan.human_verification?`<p class="why">${t("esc_human")}</p>`:""}
    <label class="lbl mt4" for="replyvia">${t("esc_reply_h")}</label>
    <div class="ask"><select id="replyvia">${usable.map(c=>{
      const d=ch.all.find(a=>a.id===c);
      return `<option value="${esc(c)}">${esc(d?tr(d.describes):c)}</option>`;}).join("")}</select></div>
    <details class="more"><summary>${t("esc_sends")}</summary>
      ${replacedNote?`<p class="why">${esc(replacedNote)}</p>`:""}${kvl(payload, k=>((plan.require||[]).find(p=>p.id===k)||{}).describes)}</details>
    <div class="btns"><button class="primary allow">${t("esc_yes")}</button>
      <button class="deny">${t("esc_no")}</button></div>`, "panel decide");
  if(!await ask(el)){
    el.className="panel stop";
    el.innerHTML=`<h3>${t("esc_none_h")}</h3><p>${t("esc_none_1")}</p>`;
    return false;
  }
  // Read after the decision, not before it: the channel was read the moment
  // the panel appeared, so a person who changed it before pressing Hand over
  // had their first choice sent.
  const via=()=>el.querySelector("#replyvia").value;
  const chosen=via();
  try{
    const r=await invoke("escalate",{base:BASE, queue:plan.queue, target:plan.target||null,
                                     replyVia:chosen, payload, lang:LANG});
    el.className="panel done";
    el.innerHTML=`<h3>${t("esc_done_h")}</h3>
      <p>${t("esc_done_1",{ref:esc(r.reference), note:esc(r.reply_note||"")})}</p>
      ${r.ticket_url?`<p class="why"><code>${esc(r.ticket_url)}</code></p>`:""}`;
    return true;
  }catch(e){
    el.className="panel stop";
    el.innerHTML=`<h3>${t("err_h")}</h3><p>${esc(tr(e))}</p>`;
    return false;
  }
}

/* The free text a publisher asked for, offered on its own consent.

   `stated` names every probe a person answered; the ones with a null value are
   those whose words did not travel. Those are the candidates, and each is shown
   as it will be sent. Sending nothing is the default and costs the user
   nothing. */
async function offerFreeText(pv, d, destination){
  // Supplied-and-withheld, and there are still words to offer. Not `dropped`:
  // that also holds machine readings, and a box to retype one of those is the
  // opposite of what the reading panel promises.
  const ids = Flow.withheldWords(pv.report, FACTS);
  if(!ids.length) return pv.report;

  // Anonymised before it is shown, not after it is agreed to. Nobody reliably
  // spots their own user name in forty lines of a log, or a token three screens
  // to the right; the person is told what was replaced and still sees — and
  // may still edit — every word that would travel.
  const shown = {};
  for(const id of ids) shown[id] = await invoke("anonymise_text",{text:FACTS[id]});
  const replaced = r => Object.entries(r.replaced||{}).map(([k,c])=>t("anon_"+k,{n:c})).join(", ");

  const el = add(`<h3>${t("free_h")}</h3>
    <p>${t("free_1",{v:esc(d.org)})}</p>
    ${destination?`<p class="why">${t("free_to",{d:esc(destination)})}</p>`:""}
    <p class="why">${t("free_2")}</p>
    ${ids.map(id=>{ const lid=qid(); return `<div class="qb">
      <div class="lbl" id="${lid}">${esc(label(id).t||id)}</div>
      <p class="why">${Object.keys(shown[id].replaced||{}).length
        ? esc(t("anon_done",{list:replaced(shown[id])})) : esc(t("anon_none"))}
        ${shown[id].cut?esc(" "+t("anon_cut",{n:shown[id].max_lines, c:shown[id].max_chars})):""}</p>
      <textarea class="ft field mono" data-id="${esc(id)}" aria-labelledby="${lid}" rows="${Math.min(14, 3 + shown[id].text.split("\n").length)}">${esc(shown[id].text)}</textarea>
    </div>`;}).join("")}
    <div class="btns"><button class="primary allow">${t("free_yes")}</button>
      <button class="deny">${t("free_no")}</button></div>`, "panel decide");

  if(!await ask(el)){
    el.className="panel"; el.innerHTML=`<h3>${t("free_none_h")}</h3><p>${t("free_none_1")}</p>`;
    return pv.report;
  }
  const typed = {};
  for(const a of el.querySelectorAll(".ft")) typed[a.dataset.id] = a.value;
  // An emptied box is a withdrawal, and every box emptied attaches nothing at
  // all rather than a consent recorded against no text.
  const text = Flow.consentedText(ids, typed);
  if(!text) return pv.report;
  try{
    const r = await invoke("attach_consented_text",
      {report:pv.report, text, destination:destination||VDOMAIN});
    el.className="panel done";
    el.innerHTML=`<h3>${t("free_ok_h")}</h3><p>${t("free_ok_1",{v:esc(d.org)})}</p>`;
    return r;
  }catch(e){
    el.className="panel stop"; el.innerHTML=`<h3>${t("err_h")}</h3><p>${esc(tr(e))}</p>`;
    return pv.report;
  }
}

async function offerReport(d, resolvedBy, outcome){
  // Asked before the button exists, not after. Efficacy is the vendor's to
  // deliver, and a vendor that has never once acted damages the channel for
  // everyone — so where one has earned it, the button is not offered at all
  // and the reason is stated.
  const st=await invoke("vendor_standing",{vendor:VDOMAIN, indexUrl:INDEX_URL});
  if(!st.offer){
    add(`<h3>${t("report_h",{v:esc(d.org)})}</h3><p>${esc(tr(st.note))}</p>`, "panel done");
    return;
  }
  const pv=await invoke("preview_report",{skill:SKILL, facts:FACTS, stated:[...STATED], decidedOn:DECIDED, resolvedBy, outcome});
  const el=add(`<h3>${t("report_h",{v:esc(d.org)})}</h3><p>${t("report_1")}</p><p class="why">${t("report_2")}</p>
    <details class="more"><summary>${t("report_what")}</summary>${kvl(pv.report.observed)}
      ${pv.held_back.length?`<p class="why mt3">${esc(t("report_held",{list:pv.held_back.map(k=>label(k).t).join(", ")}))}</p>`:""}
      <p class="why" id="pseudo"></p></details>
    <div class="btns"><button class="primary allow">${t("report_yes")}</button>
      <button class="deny">${t("report_no")}</button></div>`, "panel decide");
  invoke("identity_info",{domain:VDOMAIN}).then(i=>{
    const slot=el.querySelector("#pseudo");
    if(slot) slot.innerHTML=`<code>${esc(i.pseudonym)}</code> (${esc(i.epoch)}) — ${esc(t("pseudo_explain"))}`;
  });
  if(!await ask(el)){ el.innerHTML=`<h3>${t("report_none_h")}</h3><p>${t("report_none_1")}</p>`; return; }

  // Free text is withheld by default and offered separately, because it is the
  // one thing no policy can generalise safely — and also the most useful thing
  // a publisher can receive. An error message copied by hand is exactly what
  // they need and exactly what a machine cannot produce. So the words are shown
  // verbatim, they stay editable so anything personal can be removed, the
  // recipient is named, and the refusing button holds focus.
  const report = await offerFreeText(pv, d, VDOMAIN);

  const r=await invoke("send_report",{base:BASE, report, domain:VDOMAIN, lang:LANG});
  // What the receipt actually said, recorded locally. This is the other half of
  // the measurement: a state that changed something counts, an acknowledgement
  // does not, and the next report to this vendor is offered on that evidence.
  await invoke("record_report_state",{vendor:VDOMAIN, receiptState:r.state||"received"});
  el.className="panel done";
  el.innerHTML=`<h3>${t("receipt_h")}</h3><p>${esc(r.message||"")}</p>
    <p class="why">${esc(tr(st.note))}</p>`;
  await offerContribution();
}

// Contributing the local figure to the neutral index is a *separate*
// transmission decision and gets its own consent. It is the network effect the
// whole channel rests on — no single vendor can compute this number — which is
// exactly why it must not be taken quietly.
//
// Entries are submitted one vendor per request. The set of vendors this client
// has dealt with is a profile of the software it runs, sharper than any single
// value in it, so a batch would disclose in one call what the design refuses
// to hold at all.
async function offerContribution(){
  const preview=await invoke("contribute_standing",{indexUrl:INDEX_URL, dryRun:true});
  if(!preview.pending.length) return;
  const rows=preview.pending.map(c=>
    `<tr><td>${esc(c.vendor)}</td><td>${c.rate_pct} %</td><td>${esc(c.weight)}</td></tr>`).join("");
  const el=add(`<h3>${t("contrib_h")}</h3><p>${t("contrib_1")}</p>
    <details class="more"><summary>${t("contrib_what")}</summary>
      <table><tr><th>${t("contrib_vendor")}</th><th>${t("contrib_rate")}</th>
        <th>${t("contrib_weight")}</th></tr>${rows}</table>
      <p class="why">${t("contrib_sep")}</p></details>
    <div class="btns"><button class="primary allow">${t("contrib_yes")}</button>
      <button class="deny">${t("contrib_no")}</button></div>`, "panel decide");
  if(!await ask(el)){
    el.className="panel done";
    el.innerHTML=`<h3>${t("contrib_none_h")}</h3><p>${t("contrib_none_1")}</p>`;
    return;
  }
  const done=await invoke("contribute_standing",{indexUrl:INDEX_URL, dryRun:false});
  el.className="panel done";
  el.innerHTML=`<h3>${t("contrib_done_h")}</h3><p>${n("contrib_done_1", done.sent.length)}</p>`;
}
