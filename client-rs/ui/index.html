<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PODSHL</title>
<style>
  :root{
    /* The palette below follows `prefers-color-scheme`; without this the
       *native* parts of the window do not. The scrollbar, the caret, the
       select popups and the overscroll edge are drawn by the engine, and the
       engine assumes light unless it is told — so a dark page came with a
       white scrollbar down its right-hand side. One declaration rather than
       `::-webkit-scrollbar` rules, because it is the same answer for every
       control the engine draws and it keeps the light theme correct too. */
    color-scheme: light dark;
    --bg:#F5F8F7; --panel:#FFFFFF; --sub:#EBF0EE; --ink:#12181A; --soft:#3E4D4C;
    /* --muted was #6C7B79, which is 4.4:1 on white — under the 4.5:1 that the
       .78rem key/value text needs. #5B6B69 is 5.6:1 on the panel and 5.2:1 on
       the page background. */
    --muted:#5B6B69; --rule:#D6DFDC; --ok:#0F6E5C; --okbg:#E4F0EC;
    --warn:#9A5B2B; --warnbg:#F6EBE1; --stop:#8C2F2A;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0E1315; --panel:#161D1F; --sub:#1C2427; --ink:#E7EDEB; --soft:#BCC8C5;
           --muted:#849693; --rule:#27312F; --ok:#5BC4A7; --okbg:#12302A;
           --warn:#D9975F; --warnbg:#2A2018; --stop:#E0776F; }
    /* White on the dark theme's --ok is 2.1:1; the page background on it is
       8.9:1. Light keeps white on #0F6E5C, which is 6.2:1. */
    button.primary{color:var(--bg)}
  }
  *{box-sizing:border-box}
  /* The UA sheet hides [hidden], but any author display: rule beats it, so a
     flex row with the attribute stayed visible. */
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh}

  .idbar{flex:none;display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;background:var(--panel);
         border-bottom:1px solid var(--rule);font-size:.88rem}
  .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok)} .dot.none{background:var(--warn)}
  .idbar .who{font-weight:600}
  .idbar .spacer{margin-left:auto}
  .idbar details{font-size:.8rem;color:var(--muted)}
  /* Header controls survive a run; the intro panel does not, and settings that
     become unreachable after the first question are not settings. */
  .chip{font:inherit;font-size:.8rem;font-weight:600;padding:.24rem .6rem;border-radius:999px;
        border:1px solid var(--rule);background:var(--sub);color:var(--soft);cursor:pointer}
  .chip:hover{filter:brightness(1.08)}
  .chip:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
  .chip[disabled]{opacity:.55;cursor:not-allowed}
  select.chip{padding-right:.4rem}
  /* Both variants are rendered; a single switch shows one. Nothing re-renders,
     so the original is always exactly one click away from any consent screen. */
  .bi-o{display:none}
  body.orig .bi-t{display:none}
  body.orig .bi-o{display:inline}
  body.orig div.bi-o{display:block}
  .chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  /* A missing model is not a neutral state: without it, an unreachable vendor
     means no answer at all. It has to read as unfinished, not as a choice. */
  .chip.missing{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
  .chip.missing::before{content:"! ";font-weight:700}
  .idbar summary{cursor:pointer;list-style:none}
  .idbar summary::-webkit-details-marker{display:none}
  .idbar .proof{position:absolute;right:1rem;margin-top:.4rem;background:var(--panel);
                border:1px solid var(--rule);border-radius:5px;padding:.6rem .8rem;
                font-family:var(--mono);font-size:.74rem;max-width:34rem;z-index:5;
                box-shadow:0 6px 24px rgba(0,0,0,.14)}

  /* `min-height:0` is not a tidy-up. A flex item's automatic minimum size is
     its content, so without it this never shrinks below the panels inside it:
     the column grows past the viewport, `overflow-y` has nothing to scroll
     because the box is already as tall as its content, and the footer — where
     the next question is typed — is pushed off the bottom of a window that
     does not scroll. It only shows once the window is shorter than the
     conversation, which is every window after a few panels. */
  main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:1.2rem;
       display:flex;flex-direction:column;gap:.8rem}
  .wrap{width:100%;max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:.8rem}

  .q{font-size:1.16rem;font-weight:600;line-height:1.4}
  .q span{color:var(--muted);font-weight:400;font-size:.84rem;display:block;margin-bottom:.2rem}

  .step{display:flex;gap:.7rem;align-items:flex-start}
  .step .mark{flex:none;width:1.35rem;height:1.35rem;border-radius:50%;background:var(--okbg);
               color:var(--ok);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:.1rem}
  .step .mark.wait{background:var(--sub);color:var(--muted)}
  .step .body{flex:1;min-width:0}
  .step .title{font-weight:600}
  .step .note{color:var(--muted);font-size:.9rem}

  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:.95rem 1.05rem}
  .panel:focus{outline:none}
  .panel:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
  .panel.decide{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
  .panel.stop{border-color:var(--warn);background:var(--warnbg)}
  .panel.done{border-color:var(--ok);background:var(--okbg)}
  .panel h3{margin:0 0 .45rem;font-size:1.02rem}
  .panel p{margin:.3rem 0}

  ul.plain{margin:.5rem 0 .2rem;padding:0;list-style:none;display:grid;gap:.42rem}
  ul.plain li{display:flex;gap:.55rem}
  ul.plain li::before{content:"·";color:var(--ok);font-weight:700}
  /* A list the person picks from rather than reads: the control is the marker,
     so the bullet beside it is one mark too many. */
  /* A build with no operator compiled in is a development build. It is a fine
     thing to be and a terrible thing to be silently, because it looks exactly
     like a release and quietly cannot verify anything. */
  .devbuild{margin-left:.5rem;padding:.08rem .45rem;border:1px solid var(--warn);
            border-radius:.6rem;color:var(--warn);font-size:.78rem;white-space:nowrap}
  ul.plain.choices li::before{content:none}
  ul.plain.choices label{display:flex;gap:.55rem;align-items:baseline;cursor:pointer}
  ul.plain .lbl{font-weight:500}
  ul.plain .why{color:var(--muted);font-size:.88rem}

  details.more{margin-top:.6rem;border-top:1px solid var(--rule);padding-top:.5rem}
  details.more summary{cursor:pointer;color:var(--muted);font-size:.85rem}
  details.more[open] summary{margin-bottom:.4rem}
  /* A long value used to push the whole name column to nothing; each column
     now has a floor, and a value that does not fit wraps rather than breaking
     inside a word wherever the line happens to end. */
  .kv{display:grid;grid-template-columns:minmax(9rem,1fr) minmax(0,2fr);gap:0;font-family:var(--mono);font-size:.78rem}
  .kv div{padding:.24rem 0;border-bottom:1px solid var(--sub);overflow-wrap:anywhere}
  .kv .v{text-align:right}
  .kv .v.t{color:var(--warn)} .kv .v.f{color:var(--ok)}
  .kv .held{color:var(--muted);font-style:italic}

  .quote{margin:.55rem 0 0;padding:.6rem .8rem;background:var(--sub);border-radius:5px;
         font-size:.92rem;color:var(--soft)}
  .quote b{color:var(--warn);display:block;margin-bottom:.15rem}

  .btns{display:flex;gap:.5rem;margin-top:.85rem;flex-wrap:wrap}
  button{font:inherit;font-weight:600;padding:.52rem 1.1rem;border-radius:5px;
         border:1px solid var(--rule);background:var(--sub);color:var(--ink);cursor:pointer}
  button.primary{background:var(--ok);border-color:var(--ok);color:#fff}
  button.deny{background:transparent;color:var(--stop)}
  button.ghost{background:transparent;color:var(--soft)}
  button:hover{filter:brightness(1.07)}
  button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
  button[disabled]{opacity:.45;cursor:not-allowed}

  .spin{display:inline-block;width:.65em;height:.65em;border:2px solid var(--rule);
        border-top-color:var(--ok);border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spin{animation:none}}

  /* Everything that used to be a `style="…"` attribute lives here.
     Tauri puts a nonce into `style-src` for its own injected code, and a
     browser that sees a nonce ignores 'unsafe-inline' — so every inline style
     attribute in this window was blocked, and every answer box, list and
     question rendered at the browser's default width with none of its
     spacing. The layout of the first screen comes from this block and was
     fine, which is why nobody saw it: every panel after it was affected. */
  .field{width:100%;margin-top:.3rem;font:inherit;padding:.5rem .6rem;border:1px solid var(--rule);
         border-radius:5px;background:var(--bg);color:var(--ink);line-height:1.5}
  select.field{padding:.45rem .6rem}
  textarea.field{resize:vertical}
  .field.mono{font-family:var(--mono);font-size:.8rem}
  .ask{display:flex;gap:.5rem;margin-top:.5rem;flex-wrap:wrap}
  .ask input,.ask select{flex:1;min-width:10rem;font:inherit;padding:.5rem .6rem;border:1px solid var(--rule);
         border-radius:5px;background:var(--bg);color:var(--ink)}
  .pick{display:flex;gap:.5rem;align-items:flex-start;cursor:pointer}
  .pick input{margin-top:.35rem}
  .qb{margin:.6rem 0}
  .field.invalid{border-color:var(--stop);box-shadow:0 0 0 1px var(--stop) inset}
  .mt2{margin-top:.3rem} .mt3{margin-top:.4rem} .mt4{margin-top:.6rem} .mt5{margin-top:.7rem}
  .c-warn{color:var(--warn)} .c-muted{color:var(--muted)} .c-stop{color:var(--stop)} .c-ok{color:var(--ok)}
  /* A label that is read out and not drawn: the settings row is a row of
     fields whose meaning is their placeholder, which a screen reader does not
     treat as a name. */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  label.lbl{display:block}
  .answer code{font-family:var(--mono);font-size:.85em;background:var(--sub);padding:.05rem .3rem;border-radius:3px}
  .answer pre.md{background:var(--sub);padding:.6rem .8rem;border-radius:5px;overflow-x:auto;
                 font-family:var(--mono);font-size:.82rem;margin:.5rem 0;white-space:pre}
  .answer ul.md,.answer ol.md{margin:.4rem 0;padding-left:1.3rem}
  .answer ul.md ul{margin:.15rem 0;padding-left:1.1rem}
  .answer blockquote.md{margin:.5rem 0;padding:.3rem .8rem;border-left:3px solid var(--rule);color:var(--soft)}
  .answer p{margin:.45rem 0}
  /* The method's sections. A cause, what it does not explain, what to do and
     what would disprove it are four different things to a reader, and one
     paragraph is all four at once. Only sections the model actually returned
     are drawn — an empty heading would be the window claiming the method was
     followed when it was not. */
  .mpart{margin:.55rem 0}
  .mpart .mlbl{font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
                color:var(--muted);margin-bottom:.1rem}
  .mpart:first-child .mlbl{color:var(--soft)}
  table{border-collapse:collapse;font-size:.85rem;margin-top:.4rem}
  th,td{text-align:left;padding:.25rem .6rem .25rem 0;border-bottom:1px solid var(--sub)}

  /* Never shrinks, for the same reason: the way back into the conversation
     must not be the thing that gets squeezed out when there is little room. */
  footer{flex:none;border-top:1px solid var(--rule);background:var(--panel);padding:.7rem 1rem}
  footer .wrap{flex-direction:row;gap:.55rem;align-items:center}
  footer input{flex:1;min-width:8rem;font:inherit;padding:.55rem .7rem;border:1px solid var(--rule);
               border-radius:5px;background:var(--bg);color:var(--ink)}
  footer .adr{flex:0 0 13rem;font-size:.9rem}
  /* A narrow window: the two inputs and the button stack instead of the
     vendor field being squeezed to nothing, and the header wraps instead of
     pushing the model chip off the edge. */
  @media (max-width:560px){
    footer .wrap{flex-direction:column;align-items:stretch}
    footer .adr{flex:1 1 auto}
    .idbar{flex-wrap:wrap}
    .idbar .proof{right:.5rem;max-width:calc(100vw - 1rem)}
  }
</style></head>
<body>
<div class="app">
  <div class="idbar" id="idbar">
    <span class="dot" id="dot"></span>
    <span class="who" id="who"></span>
    <span class="devbuild" id="devbuild" hidden></span>
    <details id="proofbox" hidden>
      <summary id="proofsum"></summary>
      <div class="proof" id="proof"></div>
    </details>
    <span class="spacer"></span>
    <select class="chip" id="lang" aria-label="Language"></select>
    <button class="chip" id="origtab" hidden></button>
    <button class="chip" id="llmchip">…</button>
  </div>

  <main aria-live="polite"><div class="wrap" id="main"></div></main>

  <footer><div class="wrap">
    <input id="problem" aria-label="problem">
    <input id="vquery" class="adr" aria-label="vendor">
    <button class="primary" id="go"></button>
  </div></footer>
</div>

<script src="flow.js"></script>
<script>
"use strict";
const invoke = (c,a) => window.__TAURI__.core.invoke(c,a);
/* Which branch this window took, in the client's log.

   The flow's decisions are all here, in JavaScript, and none of them left a
   trace: on 2026-09-14 the log recorded that the search returned three
   published answers and then went silent, so which of the ways past the
   published path had been taken was argued about for a day and never settled.
   `console.log` is not the answer — the window is started from a desktop entry
   or a bar icon, nobody has a console, and the comment two screens down says
   so itself.

   Fire and forget, and it can never be why a diagnosis fails: the promise is
   swallowed, so a log that cannot be written costs nothing. */
const logUi = what => { try{ Promise.resolve(invoke("log_line",{what})).catch(()=>{}); }catch(_){} };
const $ = id => document.getElementById(id);
// Quotes too: this is used inside attribute values — `data-id="${esc(p.id)}"` —
// with values a vendor's skill chooses, and a `"` there ended the attribute.
// The window's CSP blocks inline handlers, which is a second line, not the first.
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------------------------------------------------------- i18n
   A support client that speaks one language is not a horizontal layer, and
   this product's own argument is that a localisation matrix should collapse.
   Adding a language is one object below; the keys are the contract. */
const I18N = {};
/// Every language there is, as code → the name it calls itself. One small file,
/// because a directory cannot be listed over `fetch` and in a bundled
/// application `ui/` is inside the binary rather than on disk. `I7` holds it to
/// what is actually there.
let LANGUAGES = {};
let LANG = "de";

/// One file per language, fetched rather than executed. They were `.js`
/// assigning into a global, which meant the only way to read them the way the
/// client does was to run a JavaScript engine — so the check that every
/// language defines every key needed node, and a key set is exactly the kind of
/// contract that should not depend on a second toolchain to verify. As JSON the
/// suite parses the same bytes this line parses.
///
/// **Two of them, never all.** This used to fetch every language at startup to
/// use one: 42 KB each, 169 KB for four — and four is the small case. The
/// argument this product makes is that the localisation matrix collapses onto
/// the client, so the number is meant to grow, and a startup cost that grows
/// with it while the benefit stays at one language is the wrong shape. English
/// is always loaded, because every sentence falls back to it and the binary's
/// messages are recognised by their English template; the chosen language is
/// loaded beside it, and the rest when somebody picks them.
async function loadTable(lang) {
  if (I18N[lang]) return I18N[lang];
  const res = await fetch(`i18n/${lang}.json`);
  if (!res.ok) throw new Error(`i18n/${lang}.json: ${res.status}`);
  I18N[lang] = await res.json();
  return I18N[lang];
}

async function loadLanguages(chosen) {
  const res = await fetch("i18n/languages.json");
  if (!res.ok) throw new Error(`i18n/languages.json: ${res.status}`);
  LANGUAGES = await res.json();
  await loadTable("en");
  if (chosen && chosen !== "en" && LANGUAGES[chosen]) await loadTable(chosen);
}
const t = (k, p) => {
  let s = (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;
  if (p) for (const [key, val] of Object.entries(p)) s = s.split("{"+key+"}").join(val);
  return s;
};
/// A sentence with a number in it, in the form the number needs. "1 things"
/// was written into every language as "thing(s)", which is a form no language
/// has; each such key is now two, `_one` and `_other`, and this picks. The
/// count is a value from a server or a reading and is escaped like one.
const n = (key, count, p) => t(key + (Number(count) === 1 ? "_one" : "_other"), {n: esc(count), ...(p || {})});

/// What the binary said, in the language of this window.
///
/// The binary cannot know which language was picked here, and most of what it
/// says arrives as an error string. Its sentences are the `m_*` entries of
/// en.json — it reads that file when it is built — so a message is recognised
/// by its English template, its values are lifted out, and it is said again in
/// the chosen language. Sentence by sentence, because some messages are made of
/// several. Anything not recognised is shown as it came, which is what it was
/// before: never a blank where a reason should be. Plain text out; the caller
/// escapes, as it did for the raw string.
let MSGS = null;
function messageTemplates(){
  if(MSGS) return MSGS;
  const quote = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  MSGS = Object.entries(I18N.en).filter(([k]) => k.startsWith("m_")).map(([k, tpl]) => {
    const names = [];
    const body = tpl.split(/(\{\w+\})/).map(part => {
      const m = part.match(/^\{(\w+)\}$/);
      if(m){ names.push(m[1]); return "([\\s\\S]*?)"; }
      return quote(part);
    }).join("");
    return { k, names, re: new RegExp("^" + body + "$"), lit: tpl.replace(/\{\w+\}/g, "").length };
  }).sort((a, b) => b.lit - a.lit);
  return MSGS;
}
function trOne(s, depth){
  for(const m of messageTemplates()){
    const x = s.match(m.re);
    if(!x) continue;
    const p = {};
    // A value is itself a message only sometimes — a refusal inside a
    // refusal. Most are a path, a number, a name, and stay exactly as they came.
    m.names.forEach((nm, i) => {
      const inner = depth < 3 ? trOne(x[i+1], depth+1) : null;
      p[nm] = inner ?? x[i+1];
    });
    return t(m.k, p);
  }
  return null;
}
function tr(s){
  s = String(s ?? "");
  if(!s || LANG === "en") return s;
  const whole = trOne(s, 0);
  if(whole !== null) return whole;
  const parts = s.split(/(?<=[.!?])\s+/);
  if(parts.length < 2) return s;
  return parts.map(p => trOne(p, 0) ?? p).join(" ");
}

/* ------------------------------------------------------------ plumbing */
const main = $("main");
let SKILL=null, BASE=null, FACTS={}, VDOMAIN="", LAST_FINDINGS=[], CARD=null, REJECTED=false;
// The word this run owes the maintainer, empty until a gap is reached. Reset
// with everything else: a second walk that finds an answer must not inherit
// the first one's report that nothing covered it.
let UNCOVERED="";
// Which of FACTS a person typed or chose rather than the machine reading it.
// A claim and a measurement must not be able to wear the same name.
const STATED=new Set();
/// What has been agreed to leave this machine, and to whom. See `Flow.consent`:
/// the point is that a send asks the gate for its facts rather than reaching
/// for whatever object is in scope.
const CONSENT=Flow.consent();
// Which facts the answer actually turned on, where the producer said so. With
// STATED it is what tells a publisher whether an outcome tests their rule or
// tests whether somebody answered a question correctly.
let DECIDED=[];
// Why the operator could not be reached, kept for the one panel that says so.
// It used to be shown by `publishedPath` the instant it happened and then said
// again, differently and with less in it, by the panel that offers the retry —
// two panels for one event, the first of which the person has already read by
// the time the second contradicts its tone.
let UNREACHABLE_WHY="";
// Whether a diagnosis is under way. While it is, the language cannot change —
// half a run in one language and half in another is not a translation — and
// a new panel takes focus so a screen reader follows the flow.
let RUNNING=false;
// The operator server. This was the catch-all on :8724, which served any
// product's gap report to whoever asked and counted posts rather than people.
//
// The loopback values are a fallback and not the configuration. Both are
// replaced at boot from `endpoints`, which reads them in Rust — a released
// binary has to be able to talk to a real host, and a constant here would mean
// it could only ever talk to the machine it runs on. Kept as the defaults so a
// development checkout behaves exactly as before, and kept as `let` rather than
// fetched at each use so nothing in the flow depends on a network call.
let SERVER_URL="http://127.0.0.1:8725";
// The neutral responsiveness index. Separate from everything else on purpose:
// it holds no client identity, no incident data and no vendor secrets, so
// there is nothing there worth breaching.
let INDEX_URL="http://127.0.0.1:8723";
// The host a report or a question goes to, as a person would name it.
const operatorHost = () => { try{ return new URL(SERVER_URL).host; }catch(_){ return SERVER_URL; } };
// Smooth scrolling is motion; a person who asked the system for less of it
// gets a jump instead.
const REDUCED_MOTION = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function add(html, cls, id){
  if(id){ const old=document.getElementById(id); if(old) old.remove(); }
  const d=document.createElement("div");
  if(id) d.id=id;
  d.className = cls === undefined ? "panel" : cls;
  d.innerHTML = html;
  // Focusable so a screen reader lands on the new panel rather than staying
  // where the last click was. A panel that asks for consent hands focus to
  // its refusing button instead, in `ask`.
  d.tabIndex = -1;
  main.appendChild(d);
  if(RUNNING && !d.querySelector(".deny")) d.focus({preventScroll:true});
  d.scrollIntoView({block:"end", behavior: REDUCED_MOTION ? "auto" : "smooth"});
  return d;
}
// A panel that turns into a warning — `el.className="panel stop"` happens at
// two dozen places — is announced as one. Watching the class is one line here
// against a call at every one of those places.
new MutationObserver(ms => ms.forEach(m => {
  const el = m.target;
  if(el.parentElement !== main) return;
  if(el.classList.contains("stop")) el.setAttribute("role", "alert");
  else if(el.getAttribute("role") === "alert") el.removeAttribute("role");
})).observe(main, {attributes:true, attributeFilter:["class"], subtree:true});
function step(mark, title, note, extra){
  return add(`<div class="step"><div class="mark">${mark}</div><div class="body">
    <div class="title">${title}</div>${note?`<div class="note">${note}</div>`:""}
    ${extra||""}</div></div>`, "");
}
/// A panel that has been answered. Its controls go quiet, and the frame that
/// marked it as waiting for a decision goes with them — a decided panel that
/// still looked undecided was the one thing on the screen that lied.
function settle(el){
  el.querySelectorAll("button,input,textarea,select").forEach(b=>b.disabled=true);
  el.classList.remove("decide");
}

/// What was read, with its values. Naming the fields without showing them
/// hides the user's own data from the user — the one party entitled to it.
function readValues(obj){
  return `<div class="kv mt3">` + Object.entries(obj||{}).map(([k,v])=>{
    const l = label(k);
    const name = (l && l.t && l.t !== k) ? l.t : k;
    const val = typeof v === "string" ? v : JSON.stringify(v);
    return `<div>${esc(name)}</div><div class="v">${esc(String(val).slice(0,160))}</div>`;
  }).join("") + `</div>`;
}
/// A value as the person sees it before it travels. `null` is not a value but
/// the mark of one that was withheld — a report's `stated` map carries it for
/// every answer whose words stay here — and it says so rather than "null".
const kvValue = v => v === null
  ? `<span class="held">${esc(t("held_back"))}</span>` : esc(JSON.stringify(v));
/// The same table for words meant as text: a path, a date, a name — shown as
/// they are rather than as JSON, which doubled every backslash in a path.
function kvText(obj){
  return `<div class="kv">` + Object.entries(obj||{}).map(([k,v])=>
    `<div>${esc(k)}</div><div class="v">${esc(String(v))}</div>`).join("") + `</div>`;
}
function kv(obj){
  return `<div class="kv">` + Object.entries(obj||{}).map(([k,v])=>{
    const c = v===true?"t":v===false?"f":"";
    return `<div>${esc(k)}</div><div class="v ${c}">${kvValue(v)}</div>`;
  }).join("") + `</div>`;
}
/// The same table with the publisher's words for each field rather than its
/// id: "Exactly what would be sent" showed `gpu.driver_version`, which names
/// the field to a programmer and to nobody else.
function kvl(obj, names){
  return `<div class="kv">` + Object.entries(obj||{}).map(([k,v])=>{
    const c = v===true?"t":v===false?"f":"";
    const l = label(k), name = (names && names(k)) || ((l.t && l.t !== k) ? l.t : k);
    return `<div>${esc(name)}</div><div class="v ${c}">${kvValue(v)}</div>`;
  }).join("") + `</div>`;
}
/// Vendor text, in the user's language and in the original.
/// When the vendor served the user's language there is only one variant and no
/// switch appears — nothing to compare against, so a tab would be noise.
let TRANSLATED = false;
function bi(orig, trans){
  if(!TRANSLATED || !trans || trans === orig) return esc(orig);
  return `<span class="bi"><span class="bi-t">${esc(trans)}</span><span class="bi-o" lang="en">${esc(orig)}</span></span>`;
}

/// What the panel shows, and what the next request sends: one object.
///
/// `FACTS` holds what the machine read and what the person typed, raw. The
/// request anonymises on the way out, so a panel built from `FACTS` showed a
/// Windows account name under a sentence promising "only this goes — nothing
/// about you as a person". Both halves were true and the pair was a lie: the
/// account name was not going, and nothing on screen said so.
///
/// This is the anonymised object, and it is what travels. A person who wants
/// to take out more than the rules caught can edit any answer they typed —
/// those are their words, and `<user>` is not the only thing somebody might
/// not want to send.
async function asSent(facts){
  const r = await invoke("facts_as_sent", {facts});
  return {facts: r.facts, replaced: r.replaced || {}};
}
const TYPED_IDS = () => new Set([
  ...(typeof STATED !== "undefined" ? STATED : []),
  ...(typeof TYPED !== "undefined" ? TYPED : []),
]);
const replacedLine = rep => Object.keys(rep).length
  ? t("anon_done", {list: Object.entries(rep).map(([k,c])=>t("anon_"+k,{n:c})).join(", ")})
  : t("anon_none");
/// The answers a person typed, which they may still change on the way out.
/// The rule is `Flow.editable`; what this adds is where the window keeps the
/// two sets of ids that record who supplied a value.
const editableIn = obj => Flow.editable(obj, TYPED_IDS());

function label(id){
  // `<probe id>.declined` is a fact on the wire and therefore a line on the
  // consent panel, and it was arriving there as the raw key beside the word
  // `true`. C4 says the panel names what travels *in the user's language*;
  // "serial.printed.declined / true" is neither. It is described as what it
  // is — the question, and that it went unanswered.
  if(id.endsWith(".declined")){
    const base=label(id.slice(0, -".declined".length));
    return {t:t("declined_of",{q:base.t}), w:t("declined_why")};
  }
  const p=(SKILL&&SKILL.probes||[]).find(p=>p.id===id);
  return p ? {t:(TRANSLATED && p.describes_t) || p.describes, w:(TRANSLATED && p.why_t) || p.why} : {t:id, w:""};
}
function ask(el){ return new Promise(res=>{
  const done=v=>{settle(el);res(v);};
  el.querySelector(".allow").onclick=()=>done(true);
  el.querySelector(".deny").onclick=()=>done(false);
  el.querySelector(".deny").focus();   // a stray Return must never grant consent
});}
function pickList(el){ return new Promise(res=>{
  const done=v=>{settle(el);res(v);};
  el.querySelector(".allow").onclick=()=>done([...el.querySelectorAll(".rp:checked")].map(c=>c.dataset.id));
  el.querySelector(".deny").onclick=()=>done(null);
  el.querySelector(".deny").focus();
});}
/// The button that reads says how many it will read, and reads nothing when
/// nothing is ticked — "Read the selected" with every box cleared was a
/// button that did nothing, and one that says "Read the 0 selected" is at
/// least honest, but disabled is clearer.
function liveReadCount(panel){
  const btn=panel.querySelector(".allow");
  const sync=()=>{
    const count=panel.querySelectorAll(".rp:checked").length;
    btn.textContent=t("read_yes",{n:count});
    btn.disabled = count === 0;
  };
  panel.querySelectorAll(".rp").forEach(c=>c.addEventListener("change", sync));
  sync();
}

/// A wait the person can end.
///
/// Every spinner used to be a wait with no way out: a vendor that never
/// answered, a local model loading for a minute, a translation of forty
/// probes — the only exit was to close the window. The panel that shows the
/// spinner gets a Stop button; pressing it ends the run there. The command
/// itself cannot be interrupted from here and runs to its end in the binary;
/// its result is simply no longer waited for, which is what the person asked.
class Cancelled extends Error { constructor(){ super("cancelled"); } }
function awaitOrCancel(promise, panel){
  let btns=panel.querySelector(".btns"), made=false;
  if(!btns){ btns=document.createElement("div"); btns.className="btns"; panel.appendChild(btns); made=true; }
  const b=document.createElement("button");
  b.className="ghost stopwait"; b.textContent=t("stop_wait"); btns.appendChild(b);
  const tidy=()=>{ b.remove(); if(made) btns.remove(); };
  return new Promise((res, rej)=>{
    b.onclick=()=>{
      tidy();
      panel.className="panel stop";
      panel.innerHTML=`<h3>${t("stopped_h")}</h3><p>${t("stopped_1")}</p>`;
      rej(new Cancelled());
    };
    promise.then(v=>{ tidy(); res(v); }, e=>{ tidy(); rej(e); });
  });
}

/// Every translation this session has made, by what was asked and for which
/// language. A run that is repeated — the same vendor, the same skill — asked
/// the model for the same forty sentences again, at a minute on a local model.
const TR_CACHE = new Map();
function translate(texts){
  return translateKeeping(texts, []).then(out => out.texts);
}
/// The same, keeping a published project's own terms as written (`LG8`).
/// Resolves to `{texts, lost}`: `lost` names a kept term the model dropped
/// anyway, which the window then says beside the translation.
function translateKeeping(texts, keep){
  const terms = Array.isArray(keep) ? keep : [];
  const key = LANG + "\n" + JSON.stringify(terms) + "\n" + JSON.stringify(texts);
  if(TR_CACHE.has(key)) return Promise.resolve(TR_CACHE.get(key));
  return invoke("llm_translate",{texts, to:LANG, keep:terms}).then(out => {
    const got = {texts: out.texts, lost: out.lost || []};
    TR_CACHE.set(key, got);
    return got;
  });
}
/// The model settings, read once and kept until they change. Every path
/// asked the binary again — before a translation, before a refusal, before a
/// report — for a value only `llm_set` ever changes.
let LLM_CFG = null;
async function llmGet(){
  if(!LLM_CFG) LLM_CFG = await invoke("llm_get");
  return LLM_CFG;
}
function llmSet(cfg){
  LLM_CFG = null;
  return invoke("llm_set", cfg);
}

/// A published solution's text, which is Markdown written by a stranger.
///
/// It was shown as `esc(text)` with blank lines turned into breaks, so the
/// command a solution exists to give — an indented block — ran into one line
/// with the next command, and `**System → LLM config**` arrived with its
/// asterisks. Every character is escaped first and only fixed tags are ever
/// inserted, so nothing a publisher writes can become markup: paragraphs,
/// indented and fenced code, bulleted and numbered lists with one level of
/// nesting, quotes, `code`, **bold** and *emphasis*, nothing else.
function inlineMd(s){
  return String(s).split("`").map((seg,i)=> i%2 ? `<code>${esc(seg)}</code>`
    : esc(seg).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
              .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g,"$1<i>$2</i>")).join("");
}
function md(src){
  const out=[]; let para=[], items=null, listTag="ul", code=null, fenced=false, quote=null;
  const item=x=>`<li>${inlineMd(x.text)}${x.sub.length?`<ul>${x.sub.map(s=>`<li>${inlineMd(s)}</li>`).join("")}</ul>`:""}</li>`;
  const flush=()=>{
    if(para.length){ out.push(`<p>${inlineMd(para.join(" "))}</p>`); para=[]; }
    if(items){ out.push(`<${listTag} class="md">${items.map(item).join("")}</${listTag}>`); items=null; }
    if(code){ out.push(`<pre class="md">${esc(code.join("\n"))}</pre>`); code=null; }
    if(quote){ out.push(`<blockquote class="md">${inlineMd(quote.join(" "))}</blockquote>`); quote=null; }
  };
  for(const raw of String(src||"").replace(/\r\n/g,"\n").split("\n")){
    if(/^\s*```/.test(raw)){ if(fenced){ fenced=false; flush(); } else { flush(); fenced=true; code=[]; } continue; }
    if(fenced){ code.push(raw); continue; }
    if(/^( {4}|\t)/.test(raw) && !items){ if(!code){ flush(); code=[]; } code.push(raw.replace(/^( {4}|\t)/,"")); continue; }
    if(code && raw.trim()===""){ code.push(""); continue; }
    if(code){ while(code.length && code[code.length-1]==="") code.pop(); flush(); }
    const q=raw.match(/^\s*>\s?(.*)$/);
    if(q){ if(!quote){ flush(); quote=[]; } quote.push(q[1]); continue; }
    if(quote) flush();
    // A bullet indented under a list item is its sub-list, one level deep;
    // anything deeper is shown at that one level rather than lost.
    const sub=items && raw.match(/^\s{2,}[*-]\s+(.*)$/);
    if(sub){ items[items.length-1].sub.push(sub[1]); continue; }
    const li=raw.match(/^\s*(?:[*-]|(\d+)[.)])\s+(.*)$/);
    if(li){
      const tag = li[1] ? "ol" : "ul";
      if(para.length || (items && tag !== listTag)) flush();
      listTag = tag; (items=items||[]).push({text:li[2], sub:[]}); continue;
    }
    if(items && /^\s{2,}\S/.test(raw)){ items[items.length-1].text+=" "+raw.trim(); continue; }
    if(raw.trim()===""){ flush(); continue; }
    const h=raw.match(/^#{1,6}\s+(.*)$/);
    if(h){ flush(); out.push(`<p><b>${inlineMd(h[1])}</b></p>`); continue; }
    if(items) flush();
    para.push(raw.trim());
  }
  flush();
  return out.join("");
}

/// The sentence the user consents to, in their language. It is the binary's
/// own `what` — built from the instruction and the program it would really
/// start — said again here; this window used to rebuild it from the
/// instruction itself, which was a second copy of the sentence that could
/// drift from what the binary does.
const whatText = p => tr(p.what || "");
const riskText = p => p.risk_id ? t("risk_"+p.risk_id) : (p.risk||"");
/// An action from the client's own vocabulary, by its id — the description
/// in the binary is the specification's, in English, and stays the fallback.
const actText = a => { const k="act_"+a.id, s=t(k); return s===k ? a.describes : s; };
const readItem = p => `<li><span>
  <label class="pick">
    <input type="checkbox" class="rp" data-id="${esc(p.id)}" checked>
    <span><span class="lbl">${bi(tr(p.describes), p.describes_t)}</span>
    ${p.risk?`<span class="why"> · ${esc(t("risk",{r:riskText(p)}))}</span>`:""}<br>
    ${p.why?`<span class="why">${bi(p.why, p.why_t)}</span><br>`:""}
    <span class="why">${esc(whatText(p))}</span></span></label></span></li>`;
/// Free-form context is rarely one line — "since when, which monitor, what was
/// installed before" needs room, and a cramped field asks for a cramped answer.
/// `lab` is the id of the element that names the field, so a screen reader
/// says the question and not "edit text".
const textInput = (cls, data, ph, rows, lab) => `<textarea class="${cls} field" data-id="${esc(data)}"
  rows="${rows||2}" placeholder="${esc(ph)}"${lab?` aria-labelledby="${esc(lab)}"`:""}></textarea>`;
/// An id for the label of one question. Panels are built from strings, and a
/// label has to be addressable to name a field.
let QID=0;
const qid = () => "ql" + (++QID);

/* ---------------------------------------------------------------- flow */
/* What a published project is called on the wire. For a domain that is its
   host, as it has always been. For a repository it is the verified identity,
   because the host is shared by every repository on the forge — sending that
   would ask the operator about whichever project happened to be first, and
   would put every project on GitHub into one cluster of reports. */
function subjectOf(pick){
  return pick && pick.anchor_kind === "repo" && pick.base
    ? pick.base : (pick ? pick.domain : "");
}

async function chooseVendor(){
  const q=$("vquery").value.trim();
  if(!q){
    add(`<h3>${t("which_vendor_h")}</h3><p>${t("which_vendor_1")}</p>
         <p class="why">${t("which_vendor_2")}</p>`, "panel stop");
    return null;
  }
  const hits=await invoke("search_vendors",{query:q});
  logUi(`chooseVendor hits=${hits.length}`);
  if(hits.length===1) return await confirmOrigin(hits[0], q);
  return new Promise(res=>{
    const el=add(`<h3>${t("pick_vendor_h")}</h3>
      <ul class="plain">${hits.map(h=>`<li><span><span class="lbl">${esc(h.vendor)}</span> — ${esc(h.domain)}<br>
        <span class="why">${esc(tr(h.how))} · ${esc(h.anchor_kind==="repo"
          ? t("anchor_repo",{f:h.domain}) : t("anchor_domain"))}</span></span></li>`).join("")}</ul>
      <div class="btns">${hits.map((h,i)=>`<button class="${i?'':'primary'}" data-i="${i}">${esc(h.vendor)}</button>`).join("")}</div>`);
    el.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      settle(el); res(await confirmOrigin(hits[+b.dataset.i], q));
    });
  });
}

/* A name belongs to nobody — 1872 repositories on GitHub have "engram" in
   theirs — so the list above shows candidates rather than choosing one. This is
   the one fact that can help a person recognise theirs and that an impostor
   cannot forge, because it is not on their side of the wire: this machine's own
   package database already records where each installed program came from,
   written by the distribution rather than by anybody publishing here.

   It is a reading, so it is asked for first, and refusing it costs nothing. It
   answers nothing far more often than not — nothing installed under that name,
   nothing recorded — and a disagreement is said as a disagreement: a fork or a
   repackaged version produces one honestly. The person decides either way; the
   pick is returned unchanged. */
async function confirmOrigin(pick, subject){
  if(!pick || !pick.base) return pick;
  const ok = await new Promise(res=>{
    const el=add(`<h3>${t("prov_h")}</h3><p>${t("prov_1",{s:esc(subject)})}</p>
      <div class="btns"><button class="primary" data-y="1">${t("prov_ask")}</button>
      <button data-y="">${t("prov_skip")}</button></div>`);
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ settle(el); res(!!b.dataset.y); });
  });
  if(!ok) return pick;
  let d=null;
  try{ d=await invoke("provenance_check",{anchorUrl:pick.base, subject}); }catch(e){ d=null; }
  if(d) add(`<p>${t("prov_warn",{s:esc(d.package), d:esc(d.declared),
                                 src:esc(d.source), p:esc(pick.vendor)})}</p>`, "panel warn");
  return pick;
}

async function run(){
  $("go").disabled=true;
  // Locked while a diagnosis runs, because panels already drawn keep the words
  // they were drawn with and a switch would leave the screen half in each
  // language. Locked **with a reason on it**: a grey control that says nothing
  // is the one thing this window does nowhere else, and it greys out exactly
  // when somebody might be reaching for it because they cannot read the panel.
  $("lang").disabled=true;
  $("lang").title=t("lang_locked");
  RUNNING=true;
  try { await runInner(); }
  catch(e){
    // Stopped by the person: the panel they stopped at already says so.
    if(e instanceof Cancelled) return;
    add(`<h3>${t("err_h")}</h3><p>${esc(tr(e && e.message || e))}</p>
         <p class="why">${t("err_retry")}</p>`, "panel stop");
  }
  finally { RUNNING=false; $("go").disabled=false; $("lang").disabled=false; $("lang").title=""; }
}

async function runInner(){
  main.innerHTML="";
  // A new question is a new incident. Every grant made for the last one — a
  // project directory, a program the user pointed at — goes now, and so does
  // everything that was read or answered. Nothing ever cleared the project
  // root, so a directory granted for one diagnosis stayed readable for every
  // diagnosis after it.
  await invoke("end_incident");
  SKILL=null; CARD=null; REJECTED=false; UNCOVERED=""; FACTS={}; STATED.clear(); DECIDED=[]; LAST_FINDINGS=[];
  // Agreement is spent with the incident it was given for. A run that reused
  // the last one's would be sending what somebody said yes to about a different
  // problem, possibly to a party they did not choose this time.
  CONSENT.clear();
  // And a translation belongs to the question it was made for.
  TRANSLATED=false; $("origtab").hidden=true; document.body.classList.remove("orig");
  const problem=$("problem").value.trim();
  add(`<div class="q"><span>${t("your_q")}</span>${esc(problem)}</div>`, "");

  const pick=await chooseVendor();
  if(!pick) return;
  BASE=pick.base; VDOMAIN=pick.domain;

  const s1=step(`<span class="spin"></span>`, t("contacting",{v:esc(pick.vendor)}),
                `${esc(pick.base)} <span class="why">— ${esc(tr(pick.how))}</span>`);
  const d=await awaitOrCancel(invoke("discover",{base:BASE}), s1);

  if(d.no_agent){
    $("dot").className="dot none";
    $("who").textContent = pick.vendor; $("proofbox").hidden=true; s1.remove();
    await noVendorPath(pick, problem, tr(d.reason));
    return;
  }

  $("dot").className="dot ok";
  $("who").innerHTML=`${t("verified_h")}: <b>${esc(d.org)}</b>`;
  $("proofbox").hidden=false; $("proofsum").textContent=t("proof");
  $("proof").innerHTML=kv({[t("p_card")]:t("p_found"), [t("p_sig")]:t("p_valid"),
    [t("p_ident")]:d.org, [t("p_lei")]:d.lei, [t("p_keysrc")]:tr(d.key_source)});
  s1.remove();
  step("✓", t("verified_h"), t("verified_1",{v:esc(d.org)}));

  // `triaged`, not `tr`: that name is the function that says the binary's
  // messages in this window's language, and a local of the same name hid it
  // for the whole of this function.
  const triaged=await invoke("triage",{base:BASE, problem, lang:LANG});
  if(!triaged.skill){
    add(`<h3>${t("no_skill_h")}</h3><p>${t("no_skill_1",{r:esc(triaged.reason||"")})}</p>`,"panel stop");
    if(triaged.escalate) await handover(triaged.escalate, d.org);
    return;
  }
  SKILL=triaged.skill;

  // The vendor owes English and may serve more. If it served the user's
  // language there is nothing to translate and nothing to compare; otherwise
  // translate locally and keep the original one click away.
  TRANSLATED = false;
  $("origtab").hidden = true;
  if((triaged.lang_served||"en") !== LANG){
    const cfg=await llmGet();
    if(cfg.configured){
      // Said while it happens: a local model takes seconds, and the window
      // showed nothing at all in the meantime.
      const th=add(`<p class="why"><span class="spin"></span> ${esc(t("vendor_translating",{v:d.org}))}</p>`, "panel");
      try{
        const src={title:SKILL.title, kb:SKILL.static_kb_says||""};
        SKILL.probes.forEach((p,i)=>{ src["d"+i]=p.describes; src["w"+i]=p.why||""; });
        const out=await awaitOrCancel(translate(src), th);
        SKILL.probes.forEach((p,i)=>{ p.describes_t=out["d"+i]; p.why_t=out["w"+i]; });
        SKILL.title_t=out.title; SKILL.kb_t=out.kb;
        th.remove();
        showTranslated();
      }catch(e){
        if(e instanceof Cancelled) throw e;
        th.className="panel"; th.innerHTML=`<p class="why c-warn">${t("tr_failed")}</p>`;
        th.title=tr(e);
      }
    }
  }

  // "We could not check" and "this advice is not for your machine" are
  // different answers, and the check existed without ever being called — which
  // left a Mac user free to be told to update a driver that cannot exist.
  const ap=await invoke("applicability",{required:SKILL.applies_to||{}});
  if(!ap.applies){
    add(`<h3>${t("notapplicable_h")}</h3><p>${esc(tr(ap.why))}</p>`,"panel stop");
    return;
  }

  if(!await collectFacts(SKILL.probes, d.org)) return;
  // Switching is an answer, not a detour: the rest of this run is about the
  // vendor the person just said is the wrong one. It used to continue anyway,
  // and send the readings to that vendor.
  if(await checkMismatch(pick, FACTS)) return;

  // The panel was built from `FACTS` and the request then sent `FACTS`, which
  // made "what is shown is what is sent" true by coincidence rather than by
  // construction — two reads of a mutable object with a person's decision in
  // between. `SHOWN` is that object as the panel displayed it, and it is what
  // travels: a fact that arrives after the panel is drawn cannot be sent
  // without being shown, because there is nothing left that could send it.
  const sent=await asSent(FACTS);
  let SHOWN=sent.facts;
  const send=add(`<h3>${t("send_h",{v:esc(d.org)})}</h3><p>${t("send_1")}</p>
    <ul class="plain">${Object.keys(SHOWN).map(k=>{const l=label(k);
      return `<li><span><span class="lbl">${esc(l.t)}</span><br><span class="why">${esc(l.w)}</span></span></li>`;}).join("")}</ul>
    <p class="why">${esc(replacedLine(sent.replaced))}</p>
    <details class="more"><summary>${t("exact_values")}</summary>${kvl(SHOWN)}</details>
    ${editableIn(SHOWN).length?`<details class="more"><summary>${t("edit_mine")}</summary>
      <p class="why">${t("edit_mine_1")}</p>
      ${editableIn(SHOWN).map(k=>{const lid=qid(); return `<div class="qb">
        <div class="lbl" id="${lid}">${esc(label(k).t||k)}</div>
        ${textInput("sv", k, "", 3, lid)}</div>`;}).join("")}</details>`:""}
    <div class="btns"><button class="primary allow">${t("send_yes")}</button>
      <button class="deny">${t("cancel")}</button></div>`, "panel decide");
  // The box holds what would be sent; changing it changes what is sent.
  // Emptying one is not a blank answer but a withdrawn one, and that is a wire
  // fact like any other: `<id>.declined`.
  send.querySelectorAll("textarea.sv").forEach(a=>{ a.value = SHOWN[a.dataset.id] || ""; });
  if(!await ask(send)){
    const cfg=await llmGet();
    send.className="panel stop";
    send.innerHTML=`<h3>${t("send_none_h")}</h3><p>${cfg.configured
      ? t("send_none_llm",{v:esc(d.org)}) : t("send_none_nollm",{v:esc(d.org)})}</p>`;
    return;
  }
  const edits={};
  send.querySelectorAll("textarea.sv").forEach(a=>{ edits[a.dataset.id]=a.value; });
  SHOWN=Flow.applyEdits(SHOWN, edits);
  // This panel, and nothing else, is why anything may go to the vendor.
  CONSENT.grant("vendor", SHOWN);

  // The vendor endpoint may answer "I still need X" instead of a finding. That
  // is how a decision tree gets walked without guessing: where two problems look
  // alike, it asks for the fact that separates them. Same loop the local model
  // already drives, so the client has one mechanism rather than two.
  let rem=(await invoke("diagnose",{base:BASE, skillId:SKILL.id,
    facts:CONSENT.factsFor("vendor"), lang:LANG})).remedy;
  await translateRemedy(rem);
  for(let round=1; rem.need && rem.need.length; round++){
    // `SPEC.md` is normative: an endpoint that receives `<id>.declined` must
    // not ask again for that fact. It also says an endpoint returning `need`
    // indefinitely "will loop until the user stops it" — which leaves the
    // person to notice, and they notice by clicking through the same question
    // a dozen times. A round whose every probe is already answered or already
    // declined cannot make progress whatever the endpoint intended, and that
    // is decidable here without judging the vendor's reasoning.
    const fresh=rem.need.filter(p=>!(p.id in FACTS) && !((p.id+".declined") in FACTS));
    if(!fresh.length){
      add(`<h3>${t("need_again_h")}</h3><p>${t("need_again_1",{v:esc(d.org), n:round})}</p>
        <details class="more"><summary>${t("need_again_what")}</summary>
          <ul class="plain">${rem.need.map(p=>`<li>${esc(p.describes||p.id)}</li>`).join("")}</ul>
        </details>`, "panel stop");
      break;
    }
    const machine=rem.need.filter(p=>p.kind==="machine");
    const human=rem.need.filter(p=>p.kind!=="machine");
    const el=add(`<h3>${round===1?t("need_h"):t("need_more",{n:round})}</h3>
      ${rem.need_reason?`<p>${bi(rem.need_reason, rem.need_reason_t)}</p>`:""}
      ${machine.length?`<p class="lbl">${t("need_read",{v:esc(d.org)})}</p>
        <ul class="plain">${machine.map(p=>`<li><span><span class="lbl">${esc(p.describes)}</span><br>
          <span class="why">${esc(p.why||"")}</span></span></li>`).join("")}</ul>`:""}
      ${human.length?`<p class="lbl">${t("need_ask",{v:esc(d.org)})}</p>
        ${human.map(p=>{ const id=qid(); return `<div class="qb">
          <div class="lbl" id="${id}">${esc(p.describes)}</div>
          <div class="why">${esc(p.why||"")}</div>
          ${p.choices
            ? `<select class="nq field" data-id="${esc(p.id)}" aria-labelledby="${id}">
                 <option value="">${esc(t("q_pick"))}</option>
                 ${p.choices.map(c=>`<option>${esc(c)}</option>`).join("")}</select>`
            : textInput("nq", p.id, p.example||t("q_ph"), 1, id)}
        </div>`;}).join("")}
        <p class="note c-stop" data-msg="nq"></p>`:""}
      <div class="btns"><button class="primary allow">${t("need_send")}</button>
        <button class="ghost" id="needskip">${t("need_skip")}</button>
        <button class="deny">${t("need_stop")}</button></div>`, "panel decide");

    // The mark goes the moment somebody starts correcting the answer, so it
    // never stands over a value that is already different.
    el.querySelectorAll(".nq").forEach(i=>
      i.addEventListener("input",()=>i.classList.remove("invalid")));
    const answer=await new Promise(res=>{
      const done=v=>{settle(el);res(v);};
      el.querySelector(".allow").onclick=()=>{
        // **This round checked no patterns at all.** The other two panels have
        // since the day a vendor's `pattern` first mattered; this one asks the
        // endpoint's questions and took whatever was typed, so a value the
        // vendor had already said would not do went out anyway and came back as
        // another round of the same question. It was left out of the move that
        // put the rule in one place because it had nowhere to say no — it
        // resolved on the click. It does not resolve now until the round is good.
        const values={};
        el.querySelectorAll(".nq").forEach(i=>{ values[i.dataset.id]=i.value||""; });
        const round=Flow.readAnswers(human, values);
        el.querySelectorAll(".nq").forEach(i=>
          i.classList.toggle("invalid", round.invalid.includes(i.dataset.id)));
        const note=el.querySelector("[data-msg=nq]");
        if(!round.ok){ if(note) note.textContent=t("q_pattern"); return; }
        if(note) note.textContent="";
        Object.assign(FACTS, round.facts);
        done("answer");
      };
      el.querySelector("#needskip").onclick=()=>done("skip");
      el.querySelector(".deny").onclick=()=>done("stop");
      el.querySelector(".deny").focus();
    });
    if(answer==="stop"){
      el.className="panel stop";
      el.innerHTML=`<h3>${t("need_stopped_h")}</h3><p>${t("need_stopped_1",{v:esc(d.org)})}</p>`;
      return;
    }
    if(answer==="skip"){
      // "Don't know" is a valid answer and must never dead-end: it is recorded
      // as declined so the endpoint falls back to the parent instead of asking
      // again forever.
      rem.need.forEach(p=>{ FACTS[p.id+".declined"]=true; });
    } else {
      // The typed answers went in above, under the check that let the panel
      // close. What is left is what the machine was allowed to read.
      if(machine.length){
        const c=await invoke("perform_reads",{probes:machine, allow:machine.map(p=>p.id)});
        Object.assign(FACTS, c.facts);
        machine.forEach(p=>{ if(!(p.id in c.facts)) FACTS[p.id+".declined"]=true; });
      }
    }
    step("✓", t("read_done"), t("read_done_note"), readValues(FACTS));
    // The need panel showed these and the person answered them, so they join
    // what may be sent. `SHOWN` means one thing everywhere: what has been put
    // in front of them and agreed to.
    Object.assign(SHOWN, FACTS);
    CONSENT.grant("vendor", SHOWN);
    rem=(await invoke("diagnose",{base:BASE, skillId:SKILL.id,
      facts:CONSENT.factsFor("vendor"), lang:LANG})).remedy;
    await translateRemedy(rem);
  }
  LAST_FINDINGS = rem.findings || [];
  if(rem.abstained){
    add(`<h3>${t("abstain_h")}</h3><p>${esc(rem.abstain_reason)}</p>`,"panel stop");
    // Abstention with a destination: the vendor said what it will not answer
    // and where the case goes instead.
    await handover(rem.escalate, d.org);
    await offerReport(d, "vendor_skill", "abstained");
    return;
  }

  let html="";
  for(const f of rem.findings){
    html+=`<h3>${bi(f.summary, f.summary_t)}</h3>`;
    if(f.contradicts_kb && SKILL.static_kb_says)
      html+=`<div class="quote"><b>${t("finding_kb")}</b>„${bi(SKILL.static_kb_says, SKILL.kb_t)}“ ${t("finding_kb_2")}</div>`;
    html+=`<details class="more"><summary>${t("evidence")}</summary>
      <ul class="plain">${f.evidence.map((x,i)=>`<li><span>${bi(x, (f.evidence_t||[])[i])}</span></li>`).join("")}</ul></details>`;
  }
  add(html+`<details class="more"><summary>${t("origin")}</summary>
    ${kv({skill:SKILL.id+"@"+SKILL.version, model:rem.model_id, signature:"ok"})}</details>`);

  // Every file a step changed, so one Undo puts all of them back. It kept
  // the last file only, and a plan of two steps in two files undid one.
  // A change with no file (a service, a machine variable) brings its own undo.
  const changedFiles=new Set();
  const undos=[];
  for(const s of (rem.plan||[])){
    if(s.action==="report_only") continue;
    const dry=await invoke("dry_run",{action:s.action, params:s.params});
    const el=add(`<h3>${t("change_h")}</h3><p>${esc(tr(dry))}</p>
      <p class="note c-muted">${t("why",{w:bi(s.because, s.because_t)})}</p>
      <details class="more"><summary>${t("tech_details")}</summary>${kv({action:s.action, ...s.params})}</details>
      <div class="btns"><button class="primary allow">${t("change_yes")}</button>
        <button class="deny">${t("change_no")}</button></div>`, "panel decide");
    if(!await ask(el)){
      el.className="panel stop";
      el.innerHTML=`<h3>${t("changed_none_h")}</h3><p>${t("changed_none_1")}</p>`;
      break;
    }
    // Who proposed it and what they said about the software go with it, so
    // the change is on record before it is made (`repair.rs`).
    let res;
    try{
      res=await invoke("execute",{action:s.action, params:s.params, subject:d.org,
        upstream:s.upstream||null, note:null, undoes:null});
    }catch(e){
      el.className="panel stop";
      el.innerHTML=`<h3>${t("change_failed_h")}</h3><p>${esc(tr(e))}</p>`;
      break;
    }
    if(s.params && s.params.file) changedFiles.add(s.params.file);
    if(res && res.undo) undos.push({undo:res.undo, record:res.repair_record});
  }

  const changed=changedFiles.size>0 || undos.length>0;
  if(changed){
    const done=add(`<h3>${t("done_h")}</h3><p>${t("done_1")}</p>
      <div class="btns"><button class="ghost" id="undo">${t("undo")}</button></div>`,"panel done");
    $("undo").onclick=async()=>{
      try{
        for(const file of changedFiles)
          await invoke("execute",{action:"restore_backup",params:{file},
            subject:d.org, upstream:null, note:null, undoes:null});
        for(const u of undos.reverse())
          await invoke("execute",{action:u.undo.action, params:u.undo.params,
            subject:d.org, upstream:null, note:null, undoes:u.record||null});
        done.className="panel";
        done.innerHTML=`<h3>${t("undone_h")}</h3><p>${t("undone_1")}</p>`;
      }catch(e){ done.innerHTML+=`<p class="c-stop">${esc(tr(e))}</p>`; }
    };
  }
  if(rem.escalate) await handover(rem.escalate, d.org);
  await offerReport(d, "vendor_skill", changed?"resolved":"unresolved");
}

/// The vendor's finding in the reader's language, once the vendor's skill is
/// being translated at all. The probes were translated and the finding that
/// rested on them was not — a German screen that asked in German and
/// answered in English. Same switch, same original one click away; nothing
/// happens where nothing was translated.
async function translateRemedy(rem){
  if(!TRANSLATED || !rem) return;
  const src={};
  if(rem.need_reason) src.need_reason=rem.need_reason;
  (rem.findings||[]).forEach((f,i)=>{
    if(f.summary) src["s"+i]=f.summary;
    (f.evidence||[]).forEach((x,j)=>{ src["e"+i+"_"+j]=x; });
  });
  (rem.plan||[]).forEach((s,i)=>{ if(s.because) src["b"+i]=s.because; });
  if(!Object.keys(src).length) return;
  const th=add(`<p class="why"><span class="spin"></span> ${esc(t("finding_translating"))}</p>`, "panel");
  try{
    const out=await awaitOrCancel(translate(src), th);
    rem.need_reason_t=out.need_reason;
    (rem.findings||[]).forEach((f,i)=>{
      f.summary_t=out["s"+i];
      f.evidence_t=(f.evidence||[]).map((_,j)=>out["e"+i+"_"+j]);
    });
    (rem.plan||[]).forEach((s,i)=>{ s.because_t=out["b"+i]; });
    th.remove();
  }catch(e){
    if(e instanceof Cancelled) throw e;
    // Shown as it came: an untranslated finding is still the finding.
    th.remove();
  }
}

/* ------------------------------------------- reading, then asking — once */

/* One mechanism for every path that has declared probes: a vendor's skill and a
   published project's `collect` alike. Say what would be read, read what the
   user allows, find what was not on the search path, and only then ask a person
   — for what the machine could not answer, and for what only a person can.

   This was inline in the vendor path and built its questions from the read
   *plan*, which carries machine probes only and none of their authored fields.
   So a probe declared `human` was never asked at all, and a publisher's
   `choices` on a question were never offered — every answer became free text,
   which never travels. The published path did not have it at all, and asked a
   person for facts a reading could have given. Returns false only when the
   plan itself is refused. */
async function collectFacts(probes, org){
  const byId = Object.fromEntries((probes||[]).map(p=>[p.id, p]));
  const pl=await invoke("plan_reads",{probes});
  if(!pl.ok){ add(`<h3>${t("read_none_h")}</h3><p>${esc(tr(pl.reason))}</p>`,"panel stop"); return false; }
  // The plan is the binary's, built from the instructions; the words for a
  // reading in the reader's language were made here, on the probes, and have
  // to be carried across or the consent list stays in the publisher's language.
  pl.plan.forEach(p=>{ const o=byId[p.id]; if(o){ p.describes_t=o.describes_t; p.why_t=o.why_t; } });
  const refused=pl.plan.filter(p=>p.refused), doable=pl.plan.filter(p=>!p.refused);

  let allowed=[];
  if(doable.length){
    const prl=qid();
    const rc=add(`<h3>${t("read_h")}</h3>
      <p>${t("read_vendor",{v:esc(org), n:doable.length})}</p>
      <ul class="plain">${doable.map(readItem).join("")}</ul>
      ${refused.length?`<p class="note c-warn">${esc(t("refused_anyway",
        {list:refused.map(p=>tr(p.describes)+" — "+(p.refused_kind?t("refused_"+p.refused_kind):tr(p.what))).join("; ")}))}</p>`:""}
      <details class="more"><summary>${t("proj_h")}</summary>
        <p class="why" id="${prl}">${t("proj_1")}</p>
        ${textInput("pr","projroot",t("proj_ph"),1,prl)}
        <div class="btns"><button class="ghost" id="prok">${t("proj_grant")}</button></div>
        <p class="note" id="prmsg"></p></details>
      <div class="btns"><button class="primary allow">${t("read_yes",{n:doable.length})}</button>
        <button class="deny">${t("read_no")}</button></div>`, "panel decide");
    liveReadCount(rc);

    // Granting a directory is itself a consent, so it sits with the other
    // consents rather than in a settings screen. It lasts for this diagnosis
    // and is not a wider default root; leaving it empty withdraws it again.
    rc.querySelector("#prok").onclick=async()=>{
      const v=rc.querySelector('[data-id="projroot"]')?.value.trim() || "";
      try{
        const r=await invoke("set_project_root",{path:v||null});
        rc.querySelector("#prmsg").textContent = r.granted
          ? t("proj_ok",{p:r.path}) : t("proj_none");
      }catch(e){ rc.querySelector("#prmsg").textContent=tr(e); }
    };
    allowed=(await pickList(rc))||[];
  }
  const c=await invoke("perform_reads",{probes, allow:allowed});
  Object.assign(FACTS, c.facts);
  // A measurement may replace a claim; the reverse never happens.
  Object.keys(c.facts).forEach(k=>STATED.delete(k));
  await locatePrograms(probes, allowed);
  await askAboutInterpreter();

  // What is still open: readings that came back empty, with the publisher's
  // own question where they wrote one; and every question declared for a
  // person, unless it waits on a reading that did answer.
  //
  // A reading is put to the person only if there is something a person can
  // answer: the publisher wrote a question for it, or the person withheld it
  // themselves and may prefer to say it. A reading that simply found nothing —
  // no Ollama container running, `uname` on Windows — used to become a bare
  // text box labelled "Kernel version", which nobody can fill in usefully and
  // which reads as the client asking the person to do its job.
  const withheld = id => !allowed.includes(id);
  const open=[
    ...pl.plan.filter(p=>!(p.id in FACTS) && !p.derived)
      .map(p=>({...p, ...(byId[p.id]||{})}))
      .filter(p=>p.prompt || (withheld(p.id) && !p.refused)),
    ...(probes||[]).filter(p=>p.kind!=="machine" && !(p.id in FACTS)
                        && !(p.when_missing && p.when_missing in FACTS)),
  ];
  if(open.length) await askQuestions(open, probes);
  step("✓", t("read_done"), t("read_done_note"), readValues(FACTS));
  return true;
}

/* A program a publisher asked for its version, not on this machine's search
   path. Nothing is searched for — a client walking the disk to find a program
   would be reading far more than it was allowed to — so the person is asked
   where it is. They know; pointing at it is the consent; and the file has to be
   the program that was asked about, which the binary checks rather than this
   window. Declining costs nothing: the fact is simply not read. */
async function locatePrograms(probes, allowed){
  const wanted=(probes||[]).filter(p=>p.read && p.read.op==="program_version"
    && allowed.includes(p.id) && !(p.id in FACTS));
  for(const p of wanted){
    const prog=p.read.program, id=qid();
    const el=add(`<h3 id="${id}">${t("loc_h",{p:esc(prog)})}</h3>
      <p>${t("loc_1",{p:esc(prog), d:bi(p.describes||p.id, p.describes_t)})}</p>
      <p class="why">${t("loc_2",{p:esc(prog), f:esc(p.read.flag||"--version")})}</p>
      ${textInput("locp", p.id, t("loc_ph",{p:prog}), 1, id)}
      <p class="note" data-msg="loc"></p>
      <div class="btns"><button class="primary allow">${t("loc_yes")}</button>
        <button class="deny">${t("loc_no")}</button></div>`, "panel decide");
    const msg=el.querySelector('[data-msg="loc"]');
    const done=await new Promise(res=>{
      const fin=v=>{settle(el);res(v);};
      el.querySelector(".deny").onclick=()=>fin(false);
      el.querySelector(".deny").focus();     // a stray Return must never grant
      el.querySelector(".allow").onclick=async()=>{
        const given=el.querySelector(".locp").value.trim();
        if(!given){ msg.textContent=t("loc_empty"); return; }
        try{
          const g=await invoke("grant_program_path",{program:prog, path:given});
          if(!g.granted){ msg.textContent=t("loc_err_"+g.code,{p:prog}); msg.title=g.detail||""; return; }
          const r=await invoke("perform_reads",{probes:[p], allow:[p.id]});
          if(p.id in r.facts){
            FACTS[p.id]=r.facts[p.id]; STATED.delete(p.id);
            el.dataset.path=g.path; fin(true);
          } else {
            msg.textContent=t("loc_noversion",{p:prog, path:g.path});
          }
        }catch(e){ msg.textContent=tr(e); }
      };
    });
    el.className = done ? "panel done" : "panel";
    el.innerHTML = done
      ? `<h3>${t("loc_ok_h",{p:esc(prog)})}</h3><p>${t("loc_ok_1",{v:esc(FACTS[p.id]), path:esc(el.dataset.path||"")})}</p>`
      : `<h3>${t("loc_none_h",{p:esc(prog)})}</h3>`;
  }
}

/* The questions, one panel. A bounded answer is a list — the publisher's own
   `choices` — and anything else is room to write. A question that says where
   its answer usually comes from (`log`) offers to load it: a container's
   output, or a file the person names. What is loaded is shown here and nowhere
   else; they cut it down to the lines that matter, and only that — anonymised,
   shown again, under its own consent — can ever travel. */
async function askQuestions(open, probes){
  const qa=add(`<h3>${t("ask_you_h")}</h3><p>${n("ask_you_1", open.length)}</p>
    ${open.map(p=>{ const id=qid(); return `<div class="qb">
      <div class="lbl" id="${id}">${bi(p.prompt||p.describes||p.id, p.prompt ? p.prompt_t : p.describes_t)}</div>
      <div class="why">${bi(p.why||"", p.why_t)}</div>
      ${/* A publisher may attach a question to a reading, used only when the
            reading comes back empty. Offering their choices rather than a text
            box is not cosmetic: a bounded answer may travel and free text may
            not, so an authored question is the difference between a fact the
            publisher gets and one they never see. */
        Array.isArray(p.choices)&&p.choices.length
        ? `<select class="ai field" data-id="${esc(p.id)}" aria-labelledby="${id}">
             <option value="">${esc(t("q_pick"))}</option>
             ${p.choices.map(c=>`<option>${esc(c)}</option>`).join("")}</select>`
        : p.log ? logBox(p, id) : textInput("ai",p.id,p.example||t("q_ph"),2,id)}
      </div>`;}).join("")}
    <p class="note c-stop" data-msg="qa"></p>
    <div class="btns"><button class="primary" id="qaok">${t("next")}</button>
      ${open.some(p=>p.kind==="machine")?`<button class="ghost" id="qaread">${t("read_after_all")}</button>`:""}</div>`);
  bindLogBoxes(qa);
  await new Promise(res=>{
    const fin=()=>{settle(qa);res();};
    qa.querySelector("#qaok").onclick=()=>{
      // What an answer, a skip and a value that does not fit the publisher's
      // `pattern` each mean is `Flow.readAnswers` — the same rule the hand-off
      // uses. That is the point of moving it: these two panels each had their
      // own copy and disagreed about it three times, and every disagreement was
      // a defect somebody hit.
      const values={};
      qa.querySelectorAll(".ai").forEach(i=>{ values[i.dataset.id]=i.value||""; });
      const round=Flow.readAnswers(open, values);
      qa.querySelectorAll(".ai").forEach(i=>
        i.classList.toggle("invalid", round.invalid.includes(i.dataset.id)));
      const note=qa.querySelector("[data-msg=qa]");
      // P3: caught here and asked again, not after a report was built around it.
      if(!round.ok){ if(note) note.textContent=t("q_pattern"); return; }
      if(note) note.textContent="";
      Object.assign(FACTS, round.facts);
      round.stated.forEach(id=>STATED.add(id));
      fin(); };
    const again=qa.querySelector("#qaread");
    if(again) again.onclick=async()=>{
      const machine=open.filter(p=>p.kind==="machine");
      const r=await invoke("perform_reads",{probes, allow:machine.map(p=>p.id)});
      // A measurement may replace a claim; the reverse is what this guards.
      Object.keys(r.facts).forEach(k=>STATED.delete(k));
      Object.assign(FACTS, r.facts);
      qa.className="panel";
      qa.innerHTML=`<h3>${t("read_after_all_h")}</h3>${kv(r.facts)}`; res(); };
  });
}

function logBox(p, lab){
  const log=p.log||{};
  return `${log.file?`<div class="why">${esc(t("log_hint",{f:log.file}))}</div>`:""}
    ${textInput("ai", p.id, t("log_ph"), 6, lab)}
    <div class="btns mt3">
      ${log.container?`<button class="ghost" data-load="container" data-for="${esc(p.id)}"
         data-target="${esc(log.container)}">${esc(t("log_from_container",{i:log.container}))}</button>`:""}
      <button class="ghost" data-pick="file" data-for="${esc(p.id)}">${esc(t("log_from_file"))}</button>
    </div>
    <div data-file-for="${esc(p.id)}" hidden class="mt3">
      ${textInput("logpath", p.id, t("log_path_ph",{f:log.file||"…"}), 1)}
      <div class="btns mt2"><button class="ghost" data-load="file"
         data-for="${esc(p.id)}">${esc(t("log_load"))}</button></div>
    </div>
    <p class="why" data-log-msg="${esc(p.id)}"></p>`;
}

function bindLogBoxes(root){
  const box=id=>root.querySelector(`.ai[data-id="${CSS.escape(id)}"]`);
  const say=(id,s)=>{ const m=root.querySelector(`[data-log-msg="${CSS.escape(id)}"]`); if(m) m.textContent=s; };
  root.querySelectorAll("[data-pick=file]").forEach(b=>b.onclick=()=>{
    const f=root.querySelector(`[data-file-for="${CSS.escape(b.dataset.for)}"]`);
    if(f){ f.hidden=false; const i=f.querySelector(".logpath"); if(i) i.focus(); }
  });
  root.querySelectorAll("[data-load]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.for, source=b.dataset.load;
    const target = source==="container" ? b.dataset.target
      : (root.querySelector(`[data-file-for="${CSS.escape(id)}"] .logpath`)||{value:""}).value.trim();
    if(!target){ say(id, t("log_path_empty")); return; }
    say(id, t("log_loading"));
    try{
      const r=await invoke("load_log_excerpt",{source, target});
      if(r.loaded===false){ say(id, t("log_err_"+r.code,{i:target})); return; }
      const ta=box(id);
      if(ta){ ta.value=r.text; ta.rows=12; }
      say(id, n("log_loaded", r.lines, {from:r.from}));
    }catch(e){ say(id, tr(e)); }
