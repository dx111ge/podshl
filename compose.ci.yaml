# The source, when the filesystem running `ci.sh` is not the daemon's.
#
# `compose.yaml` hands the container `.:/app` — a bind mount, resolved by the
# Docker daemon on *its* filesystem. On a laptop that is the same filesystem and
# it is exactly right. Inside a CI job it is not: the job is itself a container,
# its checkout lives in a volume, and the daemon has no such path — so it
# helpfully creates an empty directory and mounts that. `/app` is then empty and
# the first thing that runs reports `./scripts/build/build_client.sh: not found`, which
# reads like a missing file and is a missing filesystem.
#
# The checkout is reachable, though: it is a named volume on the same daemon.
# `scripts/ci/ci.sh` finds its name and adds this file, which mounts that volume
# where the bind mount would have gone. Same files, no copy, and nothing changes
# for anybody running `ci.sh` on their own machine — without the variable set,
# this file is never passed.
services:
  podshl:
    # Merged over `compose.yaml` by mount path: this `/app` replaces that one,
    # and the pgdata and cargo-target volumes beside it are left alone.
    volumes:
      - ci-src:/app

volumes:
  ci-src:
    external: true
    name: ${PODSHL_SRC_VOLUME}
