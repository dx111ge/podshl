# Both suites, on every push to the working repository.
#
# This is the one that matters. The GitHub copy of this workflow runs on the
# public mirror, which is fed by hand *after* a change is already pushed — so it
# reports rather than gates. Here it runs before anything leaves.
#
# It runs `scripts/ci/ci.sh`, the same command a developer runs. No CI-only shell:
# a gate that exists only on a server is one nobody runs before pushing, and a
# gate that exists only on a laptop is one CI cannot enforce.
#
# The runner is `podshl-builder`, made by `scripts/ci/gitea_runner.sh` and
# configured by `deploy/gitea-runner/config.yaml`, with the label
# `ubuntu-latest`. It is a container on the maintainer's machine, which has two
# consequences worth stating rather than discovering: it needs the Docker socket
# to build and run the stack, and it is not a clean machine — a suite that
# passes here because something was left behind from yesterday is a suite that
# will fail on the mirror, which is exactly what happened on the first run of
# the GitHub one.
name: suite

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Both suites
        run: scripts/ci/ci.sh sdota.de
